  <path d="M2051 802H2071" class="line"/>
  <text x="1724" y="873" font-size="23" class="quiet">Choose World → preview copy → click to place.</text>
  <text x="1724" y="914" font-size="23" class="quiet">Cancel keeps the draft; Undo removes insertion.</text>
  <text x="1724" y="955" font-size="23" class="quiet">New draft flow; the copy stays independent.</text>
  <text x="1724" y="993" font-size="20" class="quiet">B4–B5 · Save/reopen and placement are explicit</text>
  <text x="72" y="1072" font-size="28" class="title">The short path stays short. Parts, deeper tools and library saving are optional.</text>
  <rect x="72" y="1120" width="720" height="208" rx="12" fill="#e6ece3" stroke="#d0d8ce"/>
  <text x="96" y="1164" font-size="21" class="label">SAVED NATIVE FORM</text>
  <text x="96" y="1214" font-size="23" class="">Insert copy → World selection → Edit object</text>
  <text x="96" y="1260" font-size="22" class="quiet">Copy insertion ships; Focus entry is proposed.</text>
  <rect x="828" y="1120" width="720" height="208" rx="12" fill="#e6ece3" stroke="#d0d8ce"/>
  <text x="852" y="1164" font-size="21" class="label">DIRECT LIBRARY EDITING · PROPOSED</text>
  <text x="852" y="1214" font-size="23" class="">Open editable copy → the same Focus scope</text>
  <text x="852" y="1260" font-size="22" class="quiet">Original snapshot remains unchanged.</text>
  <rect x="1584" y="1120" width="744" height="208" rx="12" fill="#e6ece3" stroke="#d0d8ce"/>
  <text x="1608" y="1164" font-size="21" class="label">IMPORTED WHOLE MODEL</text>
  <text x="1608" y="1214" font-size="22" class="">World transforms today; inspection-only Focus proposed.</text>
  <text x="1608" y="1260" font-size="22" class="quiet">No invented parts, native outline or operation history.</text>
  <text x="72" y="1398" font-size="23" class="quiet">PR #244 · UX review revision · 2026-11-01</text>
