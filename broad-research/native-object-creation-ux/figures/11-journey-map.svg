  <rect x="1700" y="655" width="628" height="370" rx="16" fill="#fff" stroke="#d6ddd4"/>
  <rect x="1724" y="678" width="336" height="32" rx="16" fill="#e6ece3" stroke="#cbd5c9"/>
  <text x="1736" y="701" font-size="19" class="">B · Save, reopen and place</text>
  <text x="1724" y="744" font-size="30" class="title">Continue the draft, then compose</text>
