  <text x="1070" y="650" font-size="28" class="white">P  Refine shape · mockup 12</text>
  <text x="1070" y="692" font-size="25" class="white">N  Add and organize parts · optional</text>
  <text x="1070" y="731" font-size="24" class="white">Whole object ↔ selected part</text>
  <text x="1070" y="772" font-size="21" class="white">F2 · Part selection: mockup 08</text>
  <path d="M1070 800H1530" stroke="#668176"/>
  <text x="1070" y="837" font-size="23" class="white">One Stage · Card · selection · Camera</text>
  <text x="1070" y="874" font-size="23" class="white">Save accepted work; resume the object.</text>
  <text x="1070" y="914" font-size="21" class="white">No automatic jump to advanced tools.</text>
