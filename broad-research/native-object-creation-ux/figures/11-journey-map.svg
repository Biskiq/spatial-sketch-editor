  <text x="1724" y="338" font-size="32" class="title">Back to World</text>
  <text x="1724" y="380" font-size="24" class="quiet">Restore viewpoint, reading and World location.</text>
  <text x="1724" y="418" font-size="24" class="quiet">Whole object selected; applied edits kept.</text>
  <text x="1724" y="456" font-size="24" class="quiet">Return is not Undo or Save.</text>
