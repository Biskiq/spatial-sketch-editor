  <text x="92" y="783" font-size="21" class="quiet">Objects / My Objects</text>
  <text x="92" y="819" font-size="21" class="quiet">Start without placement.</text>
  <text x="92" y="905" font-size="18" class="quiet">B1 · Proposed entry</text>
