# Self-contained Biskiq development services.
#
#   npm run dev:local        # starts this stack, migrates, initializes storage
#                             # and runs the API and Vite editor in the foreground
#   npm run dev:local:stop   # stop services; database and object data are kept
#   npm run dev:local:reset  # stop and delete both local data volumes
#
# `dev:local` supplies every interpolation value below from its per-worktree
# `.local/dev-stack.json`; none of them is read from `.env`. The Compose project
# name and volume names are worktree-specific, so parallel checkouts cannot
# share a database, object store, port or credential.
#
# SeaweedFS is Apache-2.0. The image is pinned to a release whose multi-arch
# index includes linux/arm64 and linux/amd64. It speaks S3 SigV4 over path-style
# addressing; the API enables path style only for this local driver.
name: ${BISKIQ_LOCAL_STACK:-biskiq-local}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biskiq
      POSTGRES_PASSWORD: ${BISKIQ_LOCAL_DB_PASSWORD:?npm run dev:local supplies this value}
      POSTGRES_DB: biskiq
    ports:
      - '127.0.0.1:${BISKIQ_LOCAL_DB_PORT:?npm run dev:local supplies this value}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U biskiq -d biskiq']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.53
    command: ['mini', '-dir=/data']
    environment:
      # `weed mini` turns these into the signed S3 identity and creates the
      # bucket on first start. The init step verifies both before the API runs.
      AWS_ACCESS_KEY_ID: ${BISKIQ_LOCAL_S3_ACCESS_KEY:?npm run dev:local supplies this value}
      AWS_SECRET_ACCESS_KEY: ${BISKIQ_LOCAL_S3_SECRET_KEY:?npm run dev:local supplies this value}
      S3_BUCKET: ${BISKIQ_LOCAL_S3_BUCKET:?npm run dev:local supplies this value}
    ports:
      - '127.0.0.1:${BISKIQ_LOCAL_STORAGE_PORT:?npm run dev:local supplies this value}:8333'
    volumes:
      - s3data:/data
    healthcheck:
      # The gateway answers an unauthenticated root request with 403, so a TCP
      # connect is the container-level liveness signal. The init script performs
      # the authenticated HeadBucket/CreateBucket readiness proof.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

volumes:
  # Project-scoped: <BISKIQ_LOCAL_STACK>_pgdata and _s3data.
  pgdata:
  s3data:
