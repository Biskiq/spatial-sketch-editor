# Single required check: merge gate.
# The gate re-derives the expected jobs from the classifier and fails closed, so
# a job a profile skips (goldens on a Minimal pull request) cannot stall a merge.
name: Merge gate
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A merge group is an isolated validation of one batch. Cancelling it when
  # another group appears would discard evidence GitHub is already waiting for.
  group: merge-gate-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
env:
  CI: '1'
jobs:
  prepare:
    name: classify and check static changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      base: ${{ steps.plan.outputs.base }}
      heavy: ${{ steps.plan.outputs.heavy }}
      api: ${{ steps.plan.outputs.api }}
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
          persist-credentials: false
      # GitHub records a pull request's base SHA when its comparison is built. A
      # stacked pull request's parent branch can move afterwards, so the shallow
      # checkout above may not contain that commit. Deepen the checkout instead of
      # relaxing the ancestry check the classifier performs.
      - name: Materialize the comparison base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git merge-base --is-ancestor "$BASE_SHA" HEAD 2>/dev/null; then exit 0; fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node tools/harness/plan.mjs
      - name: Verify Minimal delta and documentation references
        if: steps.plan.outputs.profile == 'minimal'
        env:
          BASE: ${{ steps.plan.outputs.base }}
        run: |
          git diff --check "$BASE" "$GITHUB_SHA"
          if [ -n "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- ':(icase,glob)**/*.md' ':(icase,glob)*.md')" ]; then
            node tools/harness/check-docs.mjs
          fi
      - id: suites
        if: steps.plan.outputs.profile == 'full' || steps.plan.outputs.profile == 'lean'
        env:
          LEAN: ${{ steps.plan.outputs.profile == 'lean' && '--lean' || '' }}
        run: echo "matrix=$(node tools/harness/matrix.mjs $LEAN)" >> "$GITHUB_OUTPUT"

  lint:
    name: static checks
    needs: prepare
    if: needs.prepare.outputs.profile != 'minimal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run test:tooling

  suite:
    name: ${{ matrix.job }}
    needs: prepare
    if: needs.prepare.outputs.profile == 'full' || needs.prepare.outputs.profile == 'lean'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize main for repository-history tests
        run: |-
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git symbolic-ref --short -q HEAD)" = "main" ]; then
            current=$(git rev-parse HEAD)
            remote=$(git rev-parse refs/remotes/origin/main)
            if [ "$current" != "$remote" ]; then
              echo "::error::checked-out main $current does not match origin/main $remote" >&2
              exit 1
            fi
          else
            git branch --force main refs/remotes/origin/main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SvelteKit types
        run: npm exec -w @portfolio/editor -- svelte-kit sync
      - name: Run the suites
        env:
          SUITES: ${{ join(matrix.suites, '|') }}
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          failed=0
          IFS='|' read -ra suites <<< "$SUITES"
          for suite in "${suites[@]}"; do
            node tools/harness/run-suite.mjs --suite "$suite" || failed=1
          done
          exit "$failed"

  focused:
    name: editor focused verification
    needs: prepare
    if: needs.prepare.outputs.profile == 'focused'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize main for repository-history tests
        run: git branch --force main refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/harness/run-suite.mjs --suite "npm run check"
      - run: node tools/harness/run-suite.mjs --suite "editor focused tests"

  heavy:
    name: npm run test:heavy
    needs: prepare
    if: needs.prepare.outputs.profile == 'lean' && needs.prepare.outputs.heavy == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SvelteKit types
        run: npm exec -w @portfolio/editor -- svelte-kit sync
      - env:
          MATRIX_SHARD: ''
        run: node tools/harness/run-suite.mjs --suite "npm run test:heavy"

  checks:
    name: editor and package checks
    needs: prepare
    if: needs.prepare.outputs.profile == 'lean'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SvelteKit types
        run: npm exec -w @portfolio/editor -- svelte-kit sync
      - run: node tools/harness/run-suite.mjs --suite "npm run check"
      - run: node tools/harness/run-suite.mjs --suite "npm run check:api"
      - run: npm run check:camera-core
      - run: npm run check:layout-core
      - run: npm run check:geometry-core
      - run: npm run check:project-model

  build:
    name: npm run build
    needs: prepare
    if: needs.prepare.outputs.profile == 'lean'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/harness/run-suite.mjs --suite "npm run build"

  api:
    name: npm run test:api
    needs: prepare
    if: needs.prepare.outputs.profile == 'full' || (needs.prepare.outputs.profile == 'lean' && needs.prepare.outputs.api == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biskiq
          POSTGRES_PASSWORD: biskiq
          POSTGRES_DB: biskiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biskiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://biskiq:biskiq@localhost:5432/biskiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/harness/run-suite.mjs --suite "npm run test:api"

  goldens:
    name: linux-x64
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify native runner
        run: node -e "if(process.platform!=='linux'||process.arch!=='x64')process.exit(1);console.log(process.platform,process.arch,process.version)"
      - run: npm ci
      - run: npm run check:geometry-core
      - run: npm exec -w @portfolio/editor -- svelte-kit sync
      - name: Check pinned corpus and determinism boundary
        working-directory: apps/editor
        run: npx vitest run tests/lib/geometry-core

  gate:
    name: merge gate
    if: always()
    needs: [prepare, lint, suite, focused, api, goldens, heavy, checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every expected job
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
          HEAVY: ${{ needs.prepare.outputs.heavy }}
          API: ${{ needs.prepare.outputs.api }}
          CI_GATE_JOBS: ${{ toJSON(needs) }}
        run: node tools/harness/gate.mjs
