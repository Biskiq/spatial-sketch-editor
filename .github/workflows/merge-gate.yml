# The repository merge gate. It runs every PR, every push to main and every
# merge-queue group, with no path filter: a docs-only change can still break the
# architecture lane.
#
# Each job name is a stable check name. `merge gate` is the single aggregator
# that fails when any required suite's provenance is missing, failed or
# incomplete; `check guards` refuses an unapproved check removal/downgrade.
# The default-branch ruleset must require those two contexts (plus the retained
# native-form goldens job) before autonomous merges start — see
# docs/operations/ci-merge-automation.md.
#
# The editor suite is three disjoint lanes (fast, arch, heavy). Their union is
# the complete `npm test` population, proved by
# apps/editor/tests/config/lane-membership.test.ts, so the matrix never runs a
# test twice and never drops one.
name: Merge gate
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  # A merge group is an isolated validation of one batch. Cancelling it when
  # another group appears would discard evidence GitHub is already waiting for.
  # Pull requests and main pushes keep cancel-in-progress.
  group: merge-gate-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
env:
  CI: '1'
jobs:
  prepare:
    name: prepare matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: suites
        run: echo "matrix=$(node tools/harness/matrix.mjs)" >> "$GITHUB_OUTPUT"

  suite:
    name: ${{ matrix.job }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize main for repository-history tests
        run: |-
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git symbolic-ref --short -q HEAD)" = "main" ]; then
            current=$(git rev-parse HEAD)
            remote=$(git rev-parse refs/remotes/origin/main)
            if [ "$current" != "$remote" ]; then
              echo "::error::checked-out main $current does not match origin/main $remote" >&2
              exit 1
            fi
          else
            git branch --force main refs/remotes/origin/main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SvelteKit types
        run: npm exec -w @portfolio/editor -- svelte-kit sync
      - name: Produce suite provenance
        env:
          SUITES: ${{ join(matrix.suites, '|') }}
        run: |
          failed=0
          IFS='|' read -ra suites <<< "$SUITES"
          for suite in "${suites[@]}"; do
            node tools/harness/produce.mjs --suite "$suite" --artifact-dir .harness/artifacts || failed=1
          done
          exit "$failed"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.slug }}
          path: .harness/artifacts
          if-no-files-found: warn
          retention-days: 14

  api:
    name: npm run test:api
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biskiq
          POSTGRES_PASSWORD: biskiq
          POSTGRES_DB: biskiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biskiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://biskiq:biskiq@localhost:5432/biskiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Produce suite provenance
        run: node tools/harness/produce.mjs --suite "npm run test:api" --artifact-dir .harness/artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-api
          path: .harness/artifacts
          if-no-files-found: warn
          retention-days: 14

  guards:
    name: check guards
    # The queue must report this required context too. A merge_group event has
    # no pull_request object, so event-labels.mjs resolves the queued PR's
    # labels from merge_group.head_sha and fails closed when it cannot.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
      - name: Read the pull request's labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          node tools/harness/event-labels.mjs
          --event-file "$GITHUB_EVENT_PATH"
          --repo "$REPOSITORY"
          --out .harness/pr-labels.json
      - name: Refuse unapproved check removal or downgrade
        run: >-
          node tools/harness/guards.mjs
          --base "origin/${{ github.base_ref }}"
          --head HEAD
          --labels-file .harness/pr-labels.json

  gate:
    name: merge gate
    if: always()
    needs: [suite, api, guards]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: artifacts
          merge-multiple: true
      - name: Capture open issue evidence for historical comparison
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .harness
          gh issue list --state open --limit 200 --json number,title,labels,assignees > .harness/open-issues.json.tmp \
            && mv .harness/open-issues.json.tmp .harness/open-issues.json
      - name: Aggregate provenance and refuse an uncertifiable run
        run: |
          args=(--dir artifacts --out report.json --commit "$GITHUB_SHA" --ledger capabilities.json)
          if [ -f .harness/open-issues.json ]; then args+=(--issues .harness/open-issues.json); fi
          node tools/harness/aggregate.mjs "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: report.json
          if-no-files-found: warn
          retention-days: 14
