<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biskiq · PR #287 interaction review</title>
<style>
  :root {
    --forest: #11291f;
    --forest-raised: #22503c;
    --leaf: #4f8f6c;
    --leaf-soft: #9fd3b6;
    --paper: #eef0eb;
    --card: #f8f8f5;
    --stage: #e5e8e1;
    --ink: #1b201c;
    --ink-2: #4a524c;
    --ink-3: #79817b;
    --hair: #e1e4de;
    --hair-strong: #cdd2ca;
    --gold: #d4ad45;
    --gold-ink: #74560c;
    --gold-tint: #f8efd6;
    --proposal: #2a62d6;
    --refuse: #7e2718;
    --refuse-bg: #fdf3f0;
    --caution: #a8641b;
    --caution-bg: #fbf1e3;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --shadow: 0 18px 46px rgb(8 20 13 / 0.34), 0 2px 6px rgb(8 20 13 / 0.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--forest); color: var(--ink);
    font: 12.5px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  .app { height: 100vh; display: grid; grid-template-rows: 44px 1fr; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 0 14px;
    background: var(--forest); color: #eef1ec; border-bottom: 1px solid #2f4a3d;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; }
  .brand .mark {
    width: 20px; height: 20px; border-radius: 5px; background: #0d2118;
    border: 1px solid #3a5a49; display: grid; place-items: center; color: #cfe6b6; font-size: 12px;
  }
  .project { font-size: 12px; color: #c9d6cd; padding-left: 12px; border-left: 1px solid #33503f; }
  .reading { display: flex; gap: 2px; background: rgb(255 255 255 / .08); border-radius: 7px; padding: 2px; }
  .reading span { padding: 3px 10px; border-radius: 5px; font-size: 11px; color: #c9d6cd; }
  .reading .on { background: #f4f5f1; color: var(--forest); }
  .scenarios { display: flex; gap: 2px; margin-left: 8px; }
  .scenarios button {
    border: 0; background: transparent; color: #b9c8bd; padding: 5px 10px;
    border-radius: 6px; font-size: 11.5px; cursor: pointer;
  }
  .scenarios button:hover { background: rgb(255 255 255 / .08); color: #fff; }
  .scenarios button.on { background: rgb(255 255 255 / .14); color: #fff; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: #9fb2a5; }
  .pill { padding: 3px 8px; border: 1px solid #33503f; border-radius: 999px; }
  .layout { display: grid; grid-template-columns: 232px minmax(0, 1fr) 306px; min-height: 0; }
  aside.index {
    background: #fbfbf8; border-right: 1px solid var(--hair);
    display: flex; flex-direction: column; min-height: 0;
  }
  .index-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--hair); }
  .search {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--hair);
    border-radius: 6px; padding: 5px 7px; color: var(--ink-3); font-size: 11px; background: #fff;
  }
  .index-title { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 4px; font-size: 11px; color: var(--ink-2); }
  .index-title b { font-weight: 600; color: var(--ink); }
  .chips { display: flex; gap: 3px; padding: 0 12px 10px; }
  .chips span {
    border: 1px solid var(--hair); border-radius: 999px; padding: 2px 8px; font-size: 10px; color: var(--ink-2);
  }
  .chips .on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .index-list { overflow: auto; padding: 4px 6px; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    font-size: 11.5px; color: var(--ink-2); cursor: default;
  }
  .row:hover { background: #f1f2ed; }
  .row.sel { background: var(--gold-tint); color: var(--ink); }
  .row .ico { width: 14px; text-align: center; color: var(--ink-3); }
  .row .meta { margin-left: auto; font: 10px var(--mono); color: var(--ink-3); }
  .index-foot { margin-top: auto; padding: 10px 12px; border-top: 1px solid var(--hair); font-size: 10.5px; color: var(--ink-3); }
  main.stage {
    position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden;
  }
  main.stage svg { display: block; width: 100%; height: 100%; touch-action: none; }
  .stage-note {
    position: absolute; left: 16px; bottom: 92px; max-width: 340px;
    background: rgb(248 248 245 / .94); border: 1px solid var(--hair); border-radius: 8px;
    padding: 7px 10px; font-size: 10.5px; color: var(--ink-2); box-shadow: 0 4px 14px rgb(8 20 13 / .07);
  }
  .stage-note b { color: var(--ink); }
  .toast {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    background: var(--forest); color: #eef1ec; border-radius: 8px; padding: 7px 12px;
    font-size: 11.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .16s; pointer-events: none;
    max-width: 620px;
  }
  .toast.show { opacity: 1; }
  .toast.warn { background: #5a3a10; }
  .toast.bad { background: #4c1a10; }
  .gesture-chip {
    position: fixed; z-index: 40; pointer-events: none; transform: translate(14px, 16px);
    background: var(--forest); color: #fff; font-size: 10.5px; padding: 4px 8px; border-radius: 6px;
    opacity: 0; transition: opacity .1s;
  }
  .gesture-chip.show { opacity: 1; }
  .gesture-chip b { color: var(--gold); font-weight: 600; }
  .dock {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 1px; background: rgba(17,41,31,.95);
    border-radius: 12px; padding: 4px; box-shadow: var(--shadow); color: #cfdcd3;
  }
  .dock button {
    border: 0; background: transparent; color: #b8c8bd; display: grid; place-items: center; gap: 2px;
    min-width: 64px; padding: 5px 8px 4px; border-radius: 8px; font-size: 9.5px; cursor: default;
  }
  .dock button .glyph { font-size: 13px; line-height: 1; }
  .dock button.on { background: #f4f5f1; color: var(--forest); }
  aside.card {
    background: var(--card); border-left: 1px solid var(--hair);
    overflow: auto; min-height: 0; padding: 12px 12px 24px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; color: var(--ink-3); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .card-head .dots { letter-spacing: 2px; }
  .card-title { margin: 4px 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .card-sub { color: var(--ink-3); font-size: 11px; margin-bottom: 10px; }
  .card-sect { border-top: 1px solid var(--hair); padding: 9px 0 4px; margin-top: 8px; }
  .card-sect h4 { margin: 0 0 6px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .kv { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .kv.two { grid-template-columns: 1fr 1fr; }
  .field { display: grid; gap: 2px; }
  .field label { font-size: 10px; color: var(--ink-3); }
  .field .val {
    border: 1px solid var(--hair); background: #fff; border-radius: 6px; padding: 4px 7px;
    font: 12px var(--mono); color: var(--ink); min-height: 26px;
  }
  .btnrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .btn {
    border: 1px solid var(--hair-strong); background: #fff; border-radius: 6px;
    padding: 5px 9px; font-size: 11px; cursor: pointer;
  }
  .btn:hover { border-color: #9aa298; }
  .btn.primary { background: var(--forest); border-color: var(--forest); color: #fff; }
  .btn.primary:hover { background: var(--forest-raised); }
  .btn.on { background: var(--gold-tint); border-color: var(--gold); color: var(--gold-ink); }
  .btn.danger { color: var(--refuse); border-color: #d9b7ae; }
  .btn:disabled { opacity: .42; cursor: default; }
  .slider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; margin-top: 4px; }
  .slider input { width: 100%; accent-color: var(--gold); }
  .slider output { font: 11px var(--mono); min-width: 34px; text-align: right; }
  .rule { display: flex; gap: 6px; margin: 5px 0; font-size: 10.5px; color: var(--ink-2); }
  .rule i { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 2px; margin-top: 4px; }
  .rule i.prop { background: var(--proposal); }
  .rule i.warn { background: var(--caution); }
  .rule i.bad { background: var(--refuse); }
  .rule i.sel { background: var(--gold); }
  .note { border-radius: 7px; padding: 7px 8px; font-size: 10.5px; margin-top: 7px; line-height: 1.4; }
  .note.info { background: #eef3ee; color: #2c4636; }
  .note.warn { background: var(--caution-bg); color: #5b3a10; }
  .note.bad { background: var(--refuse-bg); color: #5a2217; }
  .note b { font-weight: 600; }
  .taglist { display: grid; gap: 3px; margin-top: 4px; }
  .mini { font: 10px var(--mono); color: var(--ink-3); }
  .contract { margin-top: 10px; border-top: 1px dashed var(--hair-strong); padding-top: 8px; }
  .contract summary { cursor: pointer; font-size: 10.5px; color: var(--ink-2); }
  .contract ul { margin: 6px 0 0; padding-left: 16px; font-size: 10.5px; color: var(--ink-2); }
  .contract li { margin: 3px 0; }
  .hidden { display: none !important; }
  .tag text { font-family: var(--mono); font-size: 10.5px; }
  .tag rect { fill: var(--ink); }
  .tag text { fill: #fff; }
  .tag.bad rect { fill: var(--refuse); }
  .tag.warn rect { fill: #6b4410; }
  .tag.gold rect { fill: var(--gold); }
  .tag.gold text { fill: #2a2208; }
  .tag.quiet rect { fill: #f8f8f5; stroke: var(--hair-strong); }
  .tag.quiet text { fill: var(--ink-2); }
  .rr { font-size: 10px; color: var(--ink-3); }
  .wallname { font: 10.5px var(--sans); fill: #4a524c; paint-order: stroke; stroke: #f6f3e9; stroke-width: 3px; stroke-opacity: .85; }
  .wallname.sel { fill: #74560c; font-weight: 600; }
  .roomname { font: 600 12px var(--sans); fill: #4a524c; paint-order: stroke; stroke: #f6f3e9; stroke-width: 3px; }
  .roomarea { font: 10px var(--mono); fill: #79817b; }
  .label { font: 10px var(--mono); fill: #4a524c; paint-order: stroke; stroke: #eef0eb; stroke-width: 3px; stroke-opacity: .8; }
  .label.hint { fill: #6b6f64; }
  .label.aslabel { font: 10px var(--sans); fill: #6c7066; }
  .label.stagecaption { font: 10px var(--sans); fill: #6b6f64; letter-spacing: .02em; }
  .asbuilt { fill: none; stroke: #6e7a72; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: .8; }
  .asbuilt.dim { opacity: .5; stroke-width: 1.2; }
  .rulertext { font: 9px var(--mono); fill: #6d6a5e; }
  .s { font: 9px var(--mono); fill: #7e2718; }
  .scale { font: 9.5px var(--mono); fill: #4a524c; }
  .facechip rect { fill: rgba(17,41,31,.78); }
  .facechip text { fill: #f4f5f1; font: 8.5px var(--mono); letter-spacing: .08em; }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 190px minmax(0,1fr) 280px; }
    .scenarios button { padding: 5px 7px; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0,1fr) 280px; }
    aside.index { display: none; }
    .head-right { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">✓</span>Biskiq</div>
    <div class="project">PR #287 · interaction review</div>
    <div class="reading"><span>World</span><span class="on">Experience</span></div>
    <div class="scenarios" id="scenarios">
      <button data-act="scenario" data-arg="walls" class="on">Connected walls</button>
      <button data-act="scenario" data-arg="bend">Bend a Wall</button>
      <button data-act="scenario" data-arg="circle">Circle + unfold</button>
    </div>
    <div class="head-right">
      <span class="pill">Stage 1 prototype</span>
      <span>not production geometry</span>
    </div>
  </header>

  <div class="layout">
    <aside class="index">
      <div class="index-head">
        <div class="search"><span>⌕</span><span>Filter places and things</span></div>
      </div>
      <div class="index-title"><b>Project</b><span>⌄</span></div>
      <div class="chips"><span class="on">All</span><span>◫</span><span>⌁</span><span>◯</span><span>▤</span></div>
      <div class="index-list" id="index-list"></div>
      <div class="index-foot" id="index-foot">Spatial sketch · one Wall, one Junction, one Room identity.</div>
    </aside>

    <main class="stage">
      <svg id="stage" viewBox="0 0 1200 780" aria-label="Interaction prototype stage"></svg>
      <div class="stage-note" id="stage-note"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="gesture-chip" id="gesture-chip"></div>
      <div class="dock" aria-hidden="true">
        <button class="on"><span class="glyph">➤</span>Select</button>
        <button><span class="glyph">⌂</span>Build</button>
        <button><span class="glyph">▱</span>Form</button>
        <button><span class="glyph">⌁</span>Landscape</button>
        <button><span class="glyph">▦</span>Furnish</button>
        <button><span class="glyph">◐</span>Paint</button>
        <button><span class="glyph">⌫</span>Erase</button>
        <button><span class="glyph">▥</span>Library</button>
      </div>
    </main>

    <aside class="card" id="card"></aside>
  </div>
</div>

<script>
"use strict";
/* ---------------------------------------------------------------- utilities */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const svg = $("#stage");
const NS = "http://www.w3.org/2000/svg";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round = (v, n = 2) => Number(v.toFixed(n));
const fmt = (v, n = 2) => Number(v).toFixed(n);
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const len = (a) => Math.hypot(a[0], a[1]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const perp = (a) => [-a[1], a[0]];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const wrap = (v, L) => { const r = v % L; return r < 0 ? r + L : r; };
const fmtStation = (v) => `${v < 0 ? "−" : ""}${Math.abs(v).toFixed(2)} m`;

function d(pts, close = false) {
  return pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ") + (close ? " Z" : "");
}
function tag(x, y, text, cls = "", anchor = "start") {
  const w = Math.max(52, text.length * 6.35 + 14);
  const tx = anchor === "middle" ? -w / 2 : anchor === "end" ? -w : 0;
  return `<g class="tag ${cls}" transform="translate(${(x + tx).toFixed(1)} ${(y - 24).toFixed(1)})">
    <rect width="${w.toFixed(1)}" height="20" rx="3"/><text x="6" y="13.5">${esc(text)}</text></g>`;
}
function label(x, y, text, cls = "", anchor = "middle") {
  return `<text class="label ${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${esc(text)}</text>`;
}
function hexToRgba(hex, a) {
  const h = hex.replace("#", "");
  return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`;
}
function capture(evt) { try {  capture(evt); } catch {} }
function svgPoint(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const m = svg.getScreenCTM();
  if (!m) return [0, 0];
  const p = pt.matrixTransform(m.inverse());
  return [p.x, p.y];
}
function pointInPoly(p, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < ((b[0] - a[0]) * (p[1] - a[1])) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}
function segPointDist(p, a, b) {
  const ab = sub(b, a);
  const t = clamp(((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1]) / (ab[0] * ab[0] + ab[1] * ab[1] || 1), 0, 1);
  return dist(p, add(a, mul(ab, t)));
}
function segIntersect(a, b, c, e) {
  const r = sub(b, a), s = sub(e, c);
  const den = r[0] * s[1] - r[1] * s[0];
  if (Math.abs(den) < 1e-10) return null;
  const t = ((c[0] - a[0]) * s[1] - (c[1] - a[1]) * s[0]) / den;
  const u = ((c[0] - a[0]) * r[1] - (c[1] - a[1]) * r[0]) / den;
  if (t > 1e-6 && t < 1 - 1e-6 && u > 1e-6 && u < 1 - 1e-6) {
    return { point: add(a, mul(r, t)), t, u };
  }
  return null;
}
function catmullRom(points, steps = 18) {
  if (points.length < 2) return points.slice();
  if (points.length === 2) {
    // A straight Wall still needs interior samples for picking, validation and
    // the one preview line; endpoints alone would hide a crossing at mid-span.
    const out = [];
    for (let i = 0; i <= 64; i++) out.push(lerp(points[0], points[1], i / 64));
    return out;
  }
  const out = [];
  const p = [points[0], ...points, points[points.length - 1]];
  for (let i = 1; i < p.length - 2; i++) {
    const p0 = p[i - 1], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2];
    for (let j = 0; j < steps; j++) {
      const t = j / steps, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

/* --------------------------------------------------------------- app state */
const S = {
  scenario: "walls",
  walls: null,
  bend: null,
  circle: null
};

function resetWalls() {
  const J = {
    J1: [0, 0], J2: [6, 0], J3: [6, 4], J4: [0, 4], J5: [9.4, 1.1]
  };
  S.walls = {
    junctions: J,
    base: JSON.parse(JSON.stringify(J)),
    walls: [
      { id: "B1", a: "J1", b: "J2", name: "Wall 1" },
      { id: "B2", a: "J2", b: "J3", name: "Wall 2" },
      { id: "B3", a: "J3", b: "J4", name: "Wall 3" },
      { id: "B4", a: "J4", b: "J1", name: "Wall 4" },
      { id: "B5", a: "J2", b: "J5", name: "Wing" }
    ],
    room: ["J1", "J2", "J3", "J4"],
    selection: "B1",
    hover: null,
    drag: null,
    settled: null,
    history: [],
    thickness: 0.22,
    height: 3
  };
}

function resetBend() {
  S.bend = {
    start: [0, 0],
    end: [8, 0],
    knots: [],
    neighbours: [
      { id: "L1", a: [0, 0], b: [0, 2.5] },
      { id: "L2", a: [8, 0], b: [8, -3.1] },
      { id: "L3", a: [8, -3.1], b: [11.2, -3.1] }
    ],
    obstacle: { id: "P1", a: [5.1, -2.55], b: [9.6, -2.55] },
    selection: true,
    activeKnot: null,
    hoverKnot: null,
    drag: null,
    snap: true,
    armed: false,
    settled: null,
    history: [],
    thickness: 0.22,
    height: 3
  };
}

function resetCircle() {
  const r = 3.2;
  const L = 2 * Math.PI * r;
  S.circle = {
    r, L,
    thickness: 0.3,
    height: 3,
    u: 0,
    entered: true,
    side: 1,
    // Anchor at the station nearest the view centre (the door in the entry view),
    // never station 0 and never a fixed quarter point.
    anchorStation: wrap(Math.atan2(-7.1, -1.15) * r, L),
    eye: [-1.15, -7.1],

      g.push(`<circle cx="${q[0]}" cy="${q[1]}" r="4.2" fill="#fff" stroke="#b9932f" stroke-width="1.5" stroke-dasharray="2 2"/>`);
      g.push(label(q[0] + 10, q[1] + 14, B.armed ? "Drag to bend" : "Drag to move · ⌘ drag to bend", "hint", "start"));
    }
  }

  // endpoints
  for (const [p, name] of [[B.start, "J1"], [B.end, "J2"]]) {
    const q = p2(p);
    g.push(`<circle cx="${q[0]}" cy="${q[1]}" r="4.3" fill="#fff" stroke="#3b3f37" stroke-width="1.3"/>`);
    g.push(label(q[0] + 8, q[1] + 16, name, "hint", "start"));
  }

  if (!B.drag && B.settled) {
    const q = p2(B.settled.point);
    g.push(`<circle cx="${q[0]}" cy="${q[1]}" r="9" fill="none" stroke="#a63c28" stroke-width="1.8" stroke-dasharray="3 3"/>`);
    g.push(tag(q[0] + 14, q[1] - 4, B.settled.text, "bad"));
  }

  // vertical scale bar
  const sb = p2([-1.4, 0]);
  g.push(`<line x1="${sb[0]}" y1="${sb[1]}" x2="${sb[0]}" y2="${sb[1] - W2.s * 2}" stroke="#4a524c" stroke-width="1.4"/>`);
  g.push(`<line x1="${sb[0] - 4}" y1="${sb[1]}" x2="${sb[0] + 4}" y2="${sb[1]}" stroke="#4a524c" stroke-width="1.4"/>`);
  g.push(`<line x1="${sb[0] - 4}" y1="${sb[1] - W2.s * 2}" x2="${sb[0] + 4}" y2="${sb[1] - W2.s * 2}" stroke="#4a524c" stroke-width="1.4"/>`);
  g.push(`<text class="scale" x="${sb[0] - 8}" y="${sb[1] - W2.s + 4}" text-anchor="end">2 m</text>`);

  return g.join("");
}

/* --------------------------------------------------------- scenario 3 views */
const W3 = { s: 42, ox: 600, oy: 470 };
// Deliberately asymmetric axonometric. A symmetric one collapses any Wall
// running at 45° to the view into a line; the spreading sheet must stay legible.
function p3xz([x, z], y = 0) {
  return [W3.ox + (0.94 * x - 0.62 * z) * W3.s, W3.oy + (0.34 * x + 0.52 * z) * W3.s - y * 0.92 * W3.s];
}
/** Inverse of p3xz on the ground plane (y = 0). */
function circleWorld([sx, sy]) {
  const a = (sx - W3.ox) / W3.s;
  const b = (sy - W3.oy) / W3.s;
  const det = 0.94 * 0.52 + 0.62 * 0.34;
  return [(0.52 * a + 0.62 * b) / det, (-0.34 * a + 0.94 * b) / det];
}
function circlePoint(angle, r = S.circle.r) {
  return [Math.cos(angle) * r, Math.sin(angle) * r];
}
function stationAngle(s) { return (s / S.circle.L) * Math.PI * 2; }
function stationOfPoint(p) { return wrap(Math.atan2(p[1], p[0]) * S.circle.r, S.circle.L); }
function nearestStation(p) { return stationOfPoint(p); }

function developedPoint(station, u, side) {
  const C = S.circle;
  const r = C.r;
  const L = C.L;
  const A = C.anchorStation;
  let d = station - A;
  d = ((d + L / 2) % L + L) % L - L / 2; // shortest signed arc distance
  if (side === -1) d = -d;
  const phi = stationAngle(A);
  const t = [-Math.sin(phi), Math.cos(phi)];
  const n = [-Math.cos(phi), -Math.sin(phi)];
  let px, py;
  if (u >= 0.999) {
    px = C.eye[0] * 0 + Math.cos(phi) * r + t[0] * d;
    py = Math.sin(phi) * r + t[1] * d;
  } else {
    const k = (1 - u) / r;
    px = Math.cos(phi) * r + (Math.sin(k * d) / k) * t[0] + ((1 - Math.cos(k * d)) / k) * n[0];
    py = Math.sin(phi) * r + (Math.sin(k * d) / k) * t[1] + ((1 - Math.cos(k * d)) / k) * n[1];
  }
  // The back face seen from the same camera reverses the station direction
  // about the anchor. The sheet does not move and the camera never moves.
  return [px, py];
}
function sheetPoint(station, height, u, side) {
  const p = developedPoint(station, u, side);
  return p3xz(p, height);
}
function sheetRange() {
  const C = S.circle;
  const span = C.sector / 2;
  return [C.anchorStation - span * C.r, C.anchorStation + span * C.r];
}
function sheetStations(n = 160) {
  const [a, b] = sheetRange();
  const out = [];
  for (let i = 0; i <= n; i++) out.push(a + ((b - a) * i) / n);
  return out;
}
function doorRanges() {
  const C = S.circle;
  const d0 = wrap(C.door.offset, C.L), d1 = wrap(C.door.offset + C.door.width, C.L);
  const [ra, rb] = sheetRange();
  const ranges = [];
  if (d1 > d0) ranges.push([d0, d1]);
  else { ranges.push([d0, ra + C.L]); ranges.push([ra, d1 + C.L]); }
  return ranges;
}
function sheetBandPath(u, side) {
  const top = S.circle.height;
  const stations = sheetStations();
  const base = stations.map((s) => sheetPoint(s, 0, u, side));
  const up = stations.slice().reverse().map((s) => sheetPoint(s, top, u, side));
  return `${d(base)} ${d(up).replace(/^M/, "L")} Z`;
}
function doorHolePath(u, side) {
  const C = S.circle;
  const stations = sheetStations().filter((s) => {
    const [a, b] = sheetRange();
    return s >= a && s <= b;
  });
  const holes = [];
  for (const [s0, s1] of doorRanges()) {
    const [a, b] = sheetRange();
    const lo = Math.max(s0, a), hi = Math.min(s1, b);
    if (hi - lo < 1e-4) continue;
    const along = (n) => Array.from({ length: n + 1 }, (_, i) => lo + ((hi - lo) * i) / n);
    const ss = along(14);
    const low = ss.map((s) => sheetPoint(s, C.door.sill, u, side));
    const high = ss.slice().reverse().map((s) => sheetPoint(s, C.door.head, u, side));
    holes.push(`${d(low)} ${d(high).replace(/^M/, "L")} Z`);
  }
  return holes.join(" ");
}
function renderCircle() {
  const C = S.circle;
  const g = [];
  // ground
  const floorPts = [];
  for (let i = 0; i <= 96; i++) floorPts.push(p3xz(circlePoint((i / 96) * Math.PI * 2, C.r + 4.4)));
  g.push(`<polygon points="${floorPts.map((p) => p.join(",")).join(" ")}" fill="#e9ece5" opacity=".55"/>`);
  g.push(`<polygon points="${Array.from({ length: 97 }, (_, i) => p3xz(circlePoint((i / 96) * Math.PI * 2, C.r))).map((p) => p.join(",")).join(" ")}" fill="#f6f3e9" opacity=".7"/>`);
  // 1 m plan grid inside a clip
  g.push(`<defs><clipPath id="floorellipse"><polygon points="${Array.from({ length: 97 }, (_, i) => p3xz(circlePoint((i / 96) * Math.PI * 2, C.r))).map((p) => p.join(",")).join(" ")}"/></clipPath></defs>`);
  g.push('<g clip-path="url(#floorellipse)" opacity=".7">');
  for (let m = -3; m <= 3; m++) {
    const a = p3xz([m, -C.r]), b = p3xz([m, C.r]);
    const c = p3xz([-C.r, m]), e = p3xz([C.r, m]);
    g.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#d6dacf" stroke-width=".8"/>`);
    g.push(`<line x1="${c[0]}" y1="${c[1]}" x2="${e[0]}" y2="${e[1]}" stroke="#d6dacf" stroke-width=".8"/>`);
  }
  g.push("</g>");

  // as-built: base ring, top ring, verticals
  const ring = (y, cls) => {
    const pts = Array.from({ length: 97 }, (_, i) => p3xz(circlePoint((i / 96) * Math.PI * 2), y));
    return `<polygon points="${pts.map((p) => p.join(",")).join(" ")}" class="${cls}"/>`;
  };
  g.push(ring(0, "asbuilt"));
  g.push(ring(C.height, "asbuilt dim"));
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const p0 = p3xz(circlePoint(a), 0), p1_ = p3xz(circlePoint(a), C.height);
    g.push(`<line x1="${p0[0]}" y1="${p0[1]}" x2="${p1_[0]}" y2="${p1_[1]}" class="asbuilt dim"/>`);
  }
  const lp = p3xz([0, C.r], 0);
  g.push(label(lp[0], lp[1] + 30, "Rotunda wall · as built", "aslabel"));

  // view sector on the real wall
  {
    const phi = stationAngle(C.anchorStation);
    const half = C.sector / 2;
    const a0 = phi - half, a1 = phi + half;
    const pts = [];
    for (let i = 0; i <= 60; i++) pts.push(p3xz(circlePoint(a0 + ((a1 - a0) * i) / 60), C.r + 0.02));
    g.push(`<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#d4ad45" stroke-width="3.2" opacity=".5"/>`);
    g.push(label(p3xz(circlePoint(phi), C.r)[0], p3xz(circlePoint(phi), C.r)[1] - 26, "working view 222°", "hint"));
  }

  // sheet
  if (C.u > 0.015) {
    const band = sheetBandPath(C.u, C.side);
    const hole = doorHolePath(C.u, C.side);
    const fillRule = hole ? 'fill-rule="evenodd"' : "";
    const fill = C.u > 0.985 ? "#efe6cf" : "#e9dfca";
    g.push(`<path d="${band} ${hole}" ${fillRule} fill="${fill}" stroke="#4d4a43" stroke-width="1.4" stroke-linejoin="round"/>`);
    // quiet material grid
    g.push('<g opacity=".34">');
    for (let s = Math.ceil(sheetRange()[0]); s <= sheetRange()[1]; s += 1) {
      const a = sheetPoint(s, 0.02, C.u, C.side), b = sheetPoint(s, C.height - 0.04, C.u, C.side);
      g.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#b6a783" stroke-width=".8"/>`);
    }
    for (let h = 1; h < C.height; h += 1) {
      const stations = sheetStations(60);
      const pts = stations.map((s) => sheetPoint(s, h, C.u, C.side));
      g.push(`<path d="${d(pts)}" fill="none" stroke="#b6a783" stroke-width=".8"/>`);
    }
    g.push("</g>");

    // station ruler along the foot
    g.push('<g class="ruler">');
    for (let s = Math.ceil(sheetRange()[0]); s <= sheetRange()[1]; s += 1) {
      const p = sheetPoint(s, 0.04, C.u, C.side);
      const major = Math.round(((s % 5) + 5) % 5) === 0;
      g.push(`<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${p[1] + (major ? 11 : 5)}" stroke="#6d6a5e" stroke-width="${major ? 1.2 : .8}"/>`);
      if (major) g.push(`<text class="rulertext" x="${p[0]}" y="${p[1] + 22}" text-anchor="middle">${fmt(wrap(s, C.L), 0)}</text>`);
    }
    g.push("</g>");

    // seam and cut ticks
    const seam = [0, C.L].map((s) => sheetPoint(s, 0.02, C.u, C.side));
    const cut = [sheetRange()[0], sheetRange()[1]].map((s) => sheetPoint(s, 0.02, C.u, C.side));
    for (const p of seam) g.push(`<g><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#7e2718" stroke-width="1.5"/><text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" class="s">S</text></g>`);
    for (const p of cut) g.push(`<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${p[1] - 16}" stroke="#7c8074" stroke-width="1" stroke-dasharray="2 3"/>`);

    // anchor pin
    const ap = sheetPoint(C.anchorStation, 0.02, C.u, C.side);
    g.push(`<line x1="${ap[0]}" y1="${ap[1]}" x2="${ap[0]}" y2="${ap[1] - C.height * 0.92 * W3.s}" stroke="#b9932f" stroke-width="1" stroke-dasharray="3 4"/>`);
    g.push(`<circle cx="${ap[0]}" cy="${ap[1]}" r="5" fill="#d4ad45" stroke="#6a4f0a" stroke-width="1.3"/>`);
    g.push(tag(ap[0] + 10, ap[1] - 2, "view anchor", "gold"));
    g.push(tag(ap[0] + 10, ap[1] + 22, `station ${fmt(C.anchorStation)} m`, "quiet"));

    // opening label + selection
    const mid = (C.door.offset + C.door.width / 2) % C.L;
    const dm = sheetPoint(mid, C.door.head, C.u, C.side);
    if (C.selectedOpening) {
      const h0 = sheetPoint(wrap(C.door.offset, C.L), C.door.sill, C.u, C.side);
      const h1 = sheetPoint(wrap(C.door.offset + C.door.width, C.L), C.door.sill, C.u, C.side);
      g.push(`<line x1="${h0[0]}" y1="${h0[1]}" x2="${h1[0]}" y2="${h1[1]}" stroke="#b9932f" stroke-width="3" opacity=".8"/>`);
      g.push(`<circle cx="${h1[0]}" cy="${h1[1]}" r="4.6" fill="#fff" stroke="#b9932f" stroke-width="1.8"/>`);
      g.push(tag(dm[0], dm[1] - 10, "Door D1 · drag to slide · jamb grip resizes", "gold", "middle"));
    } else {
      g.push(tag(dm[0], dm[1] - 8, "D1 · door", "quiet", "middle"));
    }

    // registration line from the opening to its as-built place
    if (C.u < 0.985) {
      const onWall = p3xz(circlePoint(stationAngle(mid)), C.door.sill);
      const onSheet = sheetPoint(mid, C.door.sill, C.u, C.side);
      g.push(`<line x1="${onWall[0]}" y1="${onWall[1]}" x2="${onSheet[0]}" y2="${onSheet[1]}" stroke="#7c8074" stroke-width="1" stroke-dasharray="3 3" opacity=".75"/>`);
    }
    // face chip on the sheet
    const fc = sheetPoint(mid, C.height * 0.52, C.u, C.side);
    g.push(`<g class="facechip"><rect x="${fc[0] - 34}" y="${fc[1] - 9}" width="68" height="18" rx="4"/><text x="${fc[0]}" y="${fc[1] + 4}" text-anchor="middle">${C.side === 1 ? "INSIDE" : "OUTSIDE"}</text></g>`);
  }

  // view eye
  const e = p3xz(C.eye, 1.35);
  const a = p3xz(circlePoint(stationAngle(C.anchorStation)), 0.2);
  g.push(`<line x1="${e[0]}" y1="${e[1]}" x2="${a[0]}" y2="${a[1]}" stroke="#4f8f6c" stroke-width="1.2" stroke-dasharray="4 4" opacity=".8"/>`);
  g.push(`<circle cx="${e[0]}" cy="${e[1]}" r="7" fill="#f8f8f5" stroke="#22503c" stroke-width="2"/>`);
  g.push(`<circle cx="${e[0]}" cy="${e[1]}" r="2.4" fill="#22503c"/>`);
  g.push(tag(e[0] + 10, e[1] - 4, "your view · drag me", "quiet"));

  // scale note
  g.push(label(24, 28, C.u > 0.985 ? "Flat sheet · stations and heights to scale" : "Partial unfold · heights true · widths follow the curve", "stagecaption", "start"));
  return g.join("");
}

/* ------------------------------------------------------------------ render */
function render() {
  const view = S.scenario === "walls" ? renderWalls() : S.scenario === "bend" ? renderBend() : renderCircle();
  svg.innerHTML = `<g id="scene">${view}</g>`;
  renderIndex();
  renderCard();
  renderNote();
  updateCursorChip();
}

function renderIndex() {
  const list = $("#index-list");
  let rows = "";
  if (S.scenario === "walls") {
    const W = S.walls;
    for (const w of W.walls) rows += `<div class="row ${W.selection === w.id ? "sel" : ""}"><span class="ico">◫</span>${w.name}<span class="meta">${fmt(dist(wallEnds(w)[0], wallEnds(w)[1]))} m</span></div>`;
    rows += `<div class="row"><span class="ico">▱</span>Room 1<span class="meta">${roomArea().toFixed(1)} m²</span></div>`;
    $("#index-foot").textContent = "5 Walls · 5 Junctions · 1 Room. Drag a Wall or a Junction; the whole affected network previews.";
  } else if (S.scenario === "bend") {
    const B = S.bend;
    rows += `<div class="row sel"><span class="ico">◫</span>Wall 1<span class="meta">${fmt(bendLength())} m</span></div>`;
    B.neighbours.forEach((w) => { rows += `<div class="row"><span class="ico">◫</span>Wall ${w.id}<span class="meta">${fmt(dist(w.a, w.b))} m</span></div>`; });
    rows += `<div class="row"><span class="ico">◫</span>Partition<span class="meta">4.50 m</span></div>`;
    $("#index-foot").textContent = `${B.knots.length} bend point${B.knots.length === 1 ? "" : "s"} · 3 m high · 0.22 m thick. Plain drag moves; ⌘/Ctrl-drag adds a bend.`;
  } else {
    const C = S.circle;
    rows += `<div class="row sel"><span class="ico">◯</span>Rotunda wall<span class="meta">r ${fmt(C.r)}</span></div>`;
    rows += `<div class="row"><span class="ico">▱</span>Room 1<span class="meta">${(Math.PI * C.r * C.r).toFixed(1)} m²</span></div>`;
    rows += `<div class="row ${C.selectedOpening ? "sel" : ""}" data-open-row><span class="ico">▤</span>Door D1<span class="meta">${fmt(C.door.offset)} m</span></div>`;
    $("#index-foot").textContent = "One closed Wall, one seam, one Room. The sheet is a view of the wall, never a second geometry.";
  }
  list.innerHTML = rows;
}

function renderNote() {
  const n = $("#stage-note");
  if (S.scenario === "walls") {
    n.innerHTML = "<b>Try:</b> drag the wing (below-right) into Wall 2, or drag J2 toward the room centre. The preview is the <b>whole candidate network</b>; the conflict is marked where it actually is.";
  } else if (S.scenario === "bend") {
    n.innerHTML = "<b>Try:</b> drag the Wall to move it; <b>⌘/Ctrl-drag</b> (or arm <b>Bend</b>) to add a point; drag a bend through the partition to see a refusal. <b>Delete</b> removes the active point.";
  } else {
    n.innerHTML = "<b>Try:</b> scrub the sheet, flip Inside/Outside, drag the door along the sheet, then <b>Done</b>. The camera never moves; the anchor is where you were looking.";
  }
}

let toastTimer = null;
function toast(text, kind = "") {
  const el = $("#toast");
  el.textContent = text;
  el.className = "toast show " + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3600);
}

function updateCursorChip() {
  const chip = $("#gesture-chip");
  const drag = S.scenario === "bend" ? S.bend.drag : null;
  if (!drag || !drag.dragged) { chip.classList.remove("show"); return; }
  chip.classList.add("show");
  chip.innerHTML = drag.kind === "knot" ? "Bend <b>point</b>" : drag.kind === "bend" ? "<b>Bend</b> · new point" : "Move <b>Wall</b>";
}

/* ------------------------------------------------------------------- cards */
function renderCard() {
  const card = $("#card");
  if (S.scenario === "walls") return renderWallsCard(card);
  if (S.scenario === "bend") return renderBendCard(card);
  return renderCircleCard(card);
}

function renderWallsCard(card) {
  const W = S.walls;
  const w = wallOf(W.selection);
  const [a, b] = wallEnds(w);
  const length = dist(a, b);
  const room = roomArea();
  const drag = W.drag;
  const state = drag && drag.dragged ? (drag.refusal ? "refused" : drag.warning ? "warning" : "accepted") : W.settled ? "refused" : "accepted";
  card.innerHTML = `
    <div class="card-head"><span>Wall</span><span class="dots">··· ⌄</span></div>
    <div class="card-title">${w.name}</div>
    <div class="card-sub">${w.a} → ${w.b} · open Wall · ${fmt(W.thickness)} m thick</div>
    <div class="kv">
      <div class="field"><label>Length</label><div class="val">${fmt(length)} m</div></div>
      <div class="field"><label>Height</label><div class="val">${fmt(W.height)} m</div></div>
      <div class="field"><label>Room</label><div class="val">${room.toFixed(1)} m²</div></div>
    </div>
    <div class="card-sect">
      <h4>Edit</h4>
      <div class="btnrow">
        <button class="btn" data-act="undo">Undo</button>
        <button class="btn" data-act="walls-reset">Reset</button>
      </div>
      <div class="note ${state === "refused" ? "bad" : state === "warning" ? "warn" : "info"}">
        ${state === "refused" && drag && drag.refusal ? `<b>Refused.</b> ${esc(drag.refusal.text)}. The full attempted network stays visible; release writes nothing.`
          : state === "refused" && W.settled ? `<b>Refused.</b> ${esc(W.settled.text)}. Move it clear; nothing was written.`
          : state === "warning" && drag && drag.warning ? `<b>Accepted with a warning.</b> ${esc(drag.warning.text)}.`
          : `<b>Accepted.</b> A valid candidate commits on release as one undo step.`}
      </div>
    </div>
    <div class="card-sect">
      <h4>Preview grammar</h4>
      <div class="rule"><i class="sel"></i><span><b>Ochre</b> — the accepted Wall and its metal. Never a proposal.</span></div>
      <div class="rule"><i class="prop"></i><span><b>Cobalt dashed</b> — the whole candidate network: the moved Wall solid-ish, affected neighbours thinner, each with its length change.</span></div>
      <div class="rule"><i class="warn"></i><span><b>Amber</b> — representable, but the consequence needs saying (Room re-derivation, a near-miss that will <em>not</em> connect).</span></div>
      <div class="rule"><i class="bad"></i><span><b>Coral</b> — refused. The <em>whole</em> attempted network stays visible and the conflict is marked at its real location, not at the pointer.</span></div>
    </div>
    <div class="card-sect">
      <h4>Gesture</h4>
      <div class="mini">Body drag → rigid translate of this Wall and its two Junctions. Neighbours stretch. Junction drag → every incident Wall follows. Release while refused → revert, no history.</div>
      <div class="contract">
        <details><summary>What changed against PR #287</summary>
          <ul>
            <li>Junction drag is not Plan-only and is not hidden when a Wall is selected.</li>
            <li>A refusal no longer collapses to a pointer-to-origin “reach”; the whole attempted network is drawn.</li>
            <li>Refused attempts are coral, never cobalt. One colour, one meaning.</li>
            <li>A near-miss is an amber <em>accepted</em> state with explicit “no connection” wording.</li>
          </ul>
        </details>
      </div>
    </div>`;
}

function renderBendCard(card) {
  const B = S.bend;
  const active = B.knots.find((k) => k.id === B.activeKnot) ?? null;
  const drag = B.drag;
  const bad = drag && drag.refusal ? drag.refusal.text : B.settled ? B.settled.text : null;
  const warn = drag && drag.warning ? drag.warning.text : null;
  card.innerHTML = `
    <div class="card-head"><span>Wall</span><span class="dots">··· ⌄</span></div>
    <div class="card-title">Wall 1</div>
    <div class="card-sub">${B.knots.length ? `${B.knots.length} bend point${B.knots.length === 1 ? "" : "s"} · cubic chain` : "straight"} · 3.00 m high</div>
    <div class="kv">
      <div class="field"><label>Length</label><div class="val">${fmt(bendLength())} m</div></div>

/* -------------------------------------------------------- scenario 1 events */
function wallsWorld(p) { return [(p[0] - W1.ox) / W1.s, (W1.oy - p[1]) / W1.s]; }
function wallsHit(p) {
  const W = S.walls;
  for (const jid of Object.keys(W.junctions)) {
    const q = p1(W.junctions[jid]);
    if (dist(p, q) <= 13) return { kind: "junction", id: jid };
  }
  let best = null;
  for (const w of W.walls) {
    const [a, b] = wallEnds(w).map(p1);
    const dd = segPointDist(p, a, b);
    if (dd <= 11 && (!best || dd < best.dd)) best = { kind: "wall", id: w.id, dd };
  }
  return best;
}
function wallsDown(evt) {
  const p = svgPoint(evt);
  const hit = wallsHit(p);
  if (!hit) { S.walls.selection = null; render(); return; }
  if (hit.kind === "wall") S.walls.selection = hit.id;
  const world = wallsWorld(p);
  const W = S.walls;
  const snapshot = JSON.parse(JSON.stringify(W.junctions));
  let cand = snapshot;
  const incident = hit.kind === "wall"
    ? (() => { const w = wallOf(hit.id); return W.walls.filter((x) => x.a === w.a || x.b === w.a || x.a === w.b || x.b === w.b).map((x) => x.id); })()
    : W.walls.filter((x) => x.a === hit.id || x.b === hit.id).map((x) => x.id);
  W.drag = {
    kind: hit.kind, id: hit.id, startWorld: world, press: p, dragged: false, snapshot,
    cand, pointer: world, incident, refusal: null, warning: null, startJunctions: W.junctions
  };
  capture(evt);
  render();
}
function wallsMove(evt) {
  const W = S.walls;
  const p = svgPoint(evt);
  const drag = W.drag;
  if (!drag) {
    let hover = null;
    for (const jid of Object.keys(W.junctions)) if (dist(p, p1(W.junctions[jid])) <= 13) hover = jid;
    if (hover !== W.hover) { W.hover = hover; render(); }
    svg.style.cursor = wallsHit(p) ? "grab" : "default";
    return;
  }
  const world = wallsWorld(p);
  if (!drag.dragged && dist(p, drag.press) > 3) drag.dragged = true;
  if (!drag.dragged) return;
  const delta = sub(world, drag.startWorld);
  const cand = JSON.parse(JSON.stringify(drag.startJunctions));
  if (drag.kind === "wall") {
    const w = wallOf(drag.id);
    cand[w.a] = add(cand[w.a], delta);
    cand[w.b] = add(cand[w.b], delta);
  } else {
    cand[drag.id] = add(cand[drag.id], delta);
  }
  const movedIds = drag.kind === "wall"
    ? [wallOf(drag.id).a, wallOf(drag.id).b]
    : [drag.id];
  const v = validateWalls(cand, movedIds);
  drag.cand = cand;
  drag.pointer = world;
  drag.refusal = v.refusal;
  drag.warning = v.warning;
  svg.style.cursor = "grabbing";
  render();
}
function wallsUp(evt) {
  const W = S.walls;
  const drag = W.drag;
  if (!drag) return;
  W.drag = null;
  try { svg.releasePointerCapture(evt.pointerId); } catch {}
  if (!drag.dragged) { render(); return; }
  if (drag.refusal) {
    W.settled = { point: drag.refusal.point, text: drag.refusal.text };
    toast(`Refused: ${drag.refusal.text}. Nothing was written.`, "bad");
  } else {
    W.history.push(JSON.parse(JSON.stringify(drag.startJunctions)));
    W.junctions = drag.cand;
    W.base = JSON.parse(JSON.stringify(drag.cand));
    W.settled = null;
    toast(drag.warning ? `Applied with a warning: ${drag.warning.text}` : `Applied: ${drag.kind === "wall" ? wallOf(drag.id).name + " moved" : "Junction moved"} · one undo step`, drag.warning ? "warn" : "");
  }
  render();
}

/* --------------------------------------------------------- scenario 2 events */
function bendWorld(p) { return [(p[0] - W2.ox) / W2.s, (W2.oy - p[1]) / W2.s]; }
function bendHit(p) {
  const B = S.bend;
  for (const k of B.knots) {
    if (dist(p, p2(k.point)) <= 12) return { kind: "knot", id: k.id };
  }
  const near = nearestOnCurve(bendWorld(p));
  if (near.dist * W2.s <= (B.thickness * W2.s) / 2 + 9) return { kind: "body", at: near };
  return null;
}
function bendDown(evt) {
  const p = svgPoint(evt);
  const B = S.bend;
  const hit = bendHit(p);
  const world = bendWorld(p);
  const wantsBend = evt.metaKey || evt.ctrlKey || B.armed;
  if (!hit) { B.activeKnot = null; render(); return; }
  const push = () => B.history.push(bendSnapshot());
  if (hit.kind === "knot") {
    push();
    B.activeKnot = hit.id;
    B.drag = { kind: "knot", id: hit.id, startWorld: world, press: p, dragged: false, curve: bendCurve() };
    capture(evt);
    render();
    return;
  }
  if (wantsBend) {
    push();
    const at = hit.at;
    const k = { id: "k" + (Date.now() % 100000), t: at.t, point: at.point };
    B.knots.push(k);
    B.activeKnot = k.id;
    B.drag = { kind: "bend", id: k.id, startWorld: world, press: p, dragged: false, curve: bendCurve(), insert: k };
    capture(evt);
    render();
    return;
  }
  push();
  B.activeKnot = null;
  B.drag = { kind: "move", startWorld: world, press: p, dragged: false, curve: bendCurve(), snapshot: bendSnapshot() };
  capture(evt);
  render();
}
function bendMove(evt) {
  const B = S.bend;
  const p = svgPoint(evt);
  const drag = B.drag;
  if (!drag) {
    const hit = bendHit(p);
    const hk = hit && hit.kind === "knot" ? hit.id : null;
    const hb = hit && hit.kind === "body" ? hit.at.point : null;
    if (hk !== B.hoverKnot || JSON.stringify(hb) !== JSON.stringify(B.hoverBody)) {
      B.hoverKnot = hk; B.hoverBody = hb; render();
    }
    svg.style.cursor = hit ? (hit.kind === "knot" ? "pointer" : evt.metaKey || evt.ctrlKey || B.armed ? "crosshair" : "grab") : "default";
    return;
  }
  if (!drag.dragged && dist(p, drag.press) > 3) drag.dragged = true;
  if (!drag.dragged) return;
  const world = bendWorld(p);
  const delta = sub(world, drag.startWorld);
  if (drag.kind === "move") {
    translateBendWall(drag.snapshot, delta);
  } else {
    const k = B.knots.find((x) => x.id === drag.id);
    if (!k) return;
    // Grab offset keeps the point under the hand; the first move cannot jump.
    if (!drag.grabOffset) drag.grabOffset = sub(k.point, drag.startWorld);
    let target = add(world, drag.grabOffset);
    if (B.snap) target = [Math.round(target[0] / 0.25) * 0.25, Math.round(target[1] / 0.25) * 0.25];
    k.point = target;
  }
  const curve = bendCurve();
  const v = validateBend(curve);
  drag.curve = curve;
  drag.refusal = v.refusal;
  drag.warning = v.warning;
  drag.pointer = world;
  svg.style.cursor = "grabbing";
  render();
}
function bendUp(evt) {
  const B = S.bend;
  const drag = B.drag;
  if (!drag) return;
  B.drag = null;
  try { svg.releasePointerCapture(evt.pointerId); } catch {}
  if (!drag.dragged) { render(); return; }
  if (drag.refusal) {
    const snap = B.history.pop();
    if (snap) restoreBend(snap);
    B.activeKnot = null;
    B.settled = { point: drag.refusal.point, text: drag.refusal.text };
    toast(`Refused: ${drag.refusal.text} Nothing was written.`, "bad");
  } else {
    B.settled = null;
    if (drag.kind === "bend") B.activeKnot = drag.id;
    toast(drag.warning ? `Applied with a warning: ${drag.warning.text}` : `Applied: ${drag.kind === "bend" ? "bend point added" : drag.kind === "knot" ? "bend point moved" : "Wall moved"} · one undo step`, drag.warning ? "warn" : "");
  }
  render();
}

/* --------------------------------------------------------- scenario 3 events */
function circleHit(p) {
  const C = S.circle;
  const e = p3xz(C.eye, 1.35);
  if (dist(p, e) <= 15) return { kind: "eye" };
  if (C.u > 0.02) {
    for (const [s0, s1] of doorRanges()) {
      const lo = Math.max(s0, sheetRange()[0]), hi = Math.min(s1, sheetRange()[1]);
      if (hi - lo < 0.02) continue;
      const poly = [
        sheetPoint(lo, C.door.sill, C.u, C.side), sheetPoint(hi, C.door.sill, C.u, C.side),
        sheetPoint(hi, C.door.head, C.u, C.side), sheetPoint(lo, C.door.head, C.u, C.side)
      ];
      if (pointInPoly(p, poly)) return { kind: "door", station: (lo + hi) / 2 };
      const jamb = sheetPoint(hi, C.door.sill + (C.door.head - C.door.sill) / 2, C.u, C.side);
      if (dist(p, jamb) <= 10) return { kind: "jamb" };
    }
  }
  return null;
}
function circleStationAt(p) {
  // nearest point on the displayed sheet centreline, in screen space
  let best = { station: 0, dist: Infinity };
  for (const s of sheetStations(220)) {
    const q = sheetPoint(s, 0.4, S.circle.u, S.circle.side);
    const dd = dist(p, q);
    if (dd < best.dist) best = { station: s, dist: dd };
  }
  return best;
}
function circleDown(evt) {
  const C = S.circle;
  const p = svgPoint(evt);
  const hit = circleHit(p);
  if (!hit) return;
  if (hit.kind === "eye") {
    C.drag = { kind: "eye", press: p, eye: C.eye.slice() };
  } else if (hit.kind === "door" || hit.kind === "jamb") {
    C.selectedOpening = true;
    C.history.push({ offset: C.door.offset, width: C.door.width });
    const at = circleStationAt(p);
    C.drag = { kind: hit.kind, press: p, station: at.station, offset: C.door.offset, width: C.door.width, moved: false };
  }
  capture(evt);
  render();
}
function circleMove(evt) {
  const C = S.circle;
  const p = svgPoint(evt);
  const drag = C.drag;
  if (!drag) { svg.style.cursor = circleHit(p) ? "pointer" : "default"; return; }
  if (drag.kind === "eye") {
    const world = circleWorld(p);
    C.eye = [clamp(world[0], -7.4, 7.4), clamp(world[1], -7.4, 7.4)];
    render();
    return;
  }
  if (!drag.moved && dist(p, drag.press) > 2) drag.moved = true;
  if (!drag.moved) return;
  const at = circleStationAt(p);
  const delta = at.station - drag.station;
  if (drag.kind === "door") {
    C.door.offset = wrap(drag.offset + delta, C.L);
  } else {
    C.door.width = clamp(drag.width + delta * (C.side === 1 ? 1 : -1), 0.6, 2.4);
    C.door.offset = wrap(C.door.offset, C.L);
  }
  render();
}
function circleUp(evt) {
  const C = S.circle;
  const drag = C.drag;
  C.drag = null;
  try { svg.releasePointerCapture(evt.pointerId); } catch {}
  if (drag && drag.kind !== "eye" && !drag.moved) C.history.pop();
  if (drag && drag.kind !== "eye" && drag.moved) {
    toast(`Opening edited on the sheet · canonical station ${fmt(C.door.offset)} m · one undo step`);
  }
  render();
}

/* --------------------------------------------------------------- dispatch */
svg.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (S.scenario === "walls") wallsDown(e);
  else if (S.scenario === "bend") bendDown(e);
  else circleDown(e);
});
svg.addEventListener("pointermove", (e) => {
  if (S.scenario === "walls") wallsMove(e);
  else if (S.scenario === "bend") bendMove(e);
  else circleMove(e);
});
svg.addEventListener("pointerup", (e) => {
  if (S.scenario === "walls") wallsUp(e);
  else if (S.scenario === "bend") bendUp(e);
  else circleUp(e);
});
svg.addEventListener("pointercancel", (e) => {
  if (S.scenario === "walls") { S.walls.drag = null; render(); }
  else if (S.scenario === "bend") { S.bend.drag = null; render(); }
  else { S.circle.drag = null; render(); }
});
window.addEventListener("keydown", (e) => {
  if (S.scenario === "bend") {
    if (e.key === "Delete" || e.key === "Backspace") {
      if (S.bend.activeKnot && document.activeElement.tagName !== "INPUT") {
        e.preventDefault();
        S.bend.history.push(JSON.parse(JSON.stringify({ start: S.bend.start, end: S.bend.end, knots: S.bend.knots })));
        S.bend.knots = S.bend.knots.filter((k) => k.id !== S.bend.activeKnot);
        S.bend.activeKnot = null;
        toast("Bend point removed · one undo step");
        render();
      }
    }
    if (e.key === "Escape") { S.bend.activeKnot = null; S.bend.armed = false; render(); }
    if (e.key === "b" || e.key === "B") {
      if (document.activeElement.tagName !== "INPUT") { S.bend.armed = !S.bend.armed; render(); }
    }
  }
  if (S.scenario === "circle" && e.key === "Escape") {
    S.circle.selectedOpening = false; render();
  }
});

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const arg = btn.dataset.arg;
  if (act === "scenario") {
    S.scenario = arg;
    document.querySelectorAll(".scenarios button").forEach((b) => b.classList.toggle("on", b.dataset.arg === arg));
    render();
    return;
  }
  if (act === "undo") {
    if (S.scenario === "walls") {
      const prev = S.walls.history.pop();
      if (prev) { S.walls.junctions = prev; S.walls.base = JSON.parse(JSON.stringify(prev)); S.walls.settled = null; toast("Undone"); }
    } else if (S.scenario === "bend") {
      const prev = S.bend.history.pop();
      if (prev) { restoreBend(prev); S.bend.activeKnot = null; S.bend.settled = null; toast("Undone"); }
    } else {
      const prev = S.circle.history.pop();
      if (prev) { S.circle.door.offset = prev.offset; S.circle.door.width = prev.width; toast("Undone"); }
    }
    render();
    return;
  }
  if (act === "walls-reset") { resetWalls(); toast("Scenario reset"); render(); return; }
  if (act === "bend-reset") { resetBend(); toast("Scenario reset"); render(); return; }
  if (act === "bend-arm") { S.bend.armed = !S.bend.armed; render(); return; }
  if (act === "bend-snap") { S.bend.snap = !S.bend.snap; render(); return; }
  if (act === "knot-remove") {
    if (S.bend.activeKnot) {
      S.bend.history.push(bendSnapshot());
      S.bend.knots = S.bend.knots.filter((k) => k.id !== S.bend.activeKnot);
      S.bend.activeKnot = null;
      toast("Bend point removed · one undo step");
      render();
    }
    return;
  }
  if (act === "bend-straighten") {
    if (S.bend.knots.length) {
      S.bend.history.push(bendSnapshot());
      S.bend.knots = []; S.bend.activeKnot = null; toast("Straightened · one undo step"); render();
    }
    return;
  }
  if (act === "u-half") { S.circle.u = 0.5; render(); return; }
  if (act === "u-flat") { S.circle.u = 1; render(); return; }
  if (act === "side") { S.circle.side *= -1; toast(`Reading ${S.circle.side === 1 ? "Inside" : "Outside"} · sheet flipped about the anchor · camera unchanged`); render(); return; }
  if (act === "done") {
    S.circle.u = 0;
    S.circle.selectedOpening = false;
    S.circle.entered = false;
    toast("Folded back · returned to the entry view exactly · camera never moved");
    render();
    return;
  }
  if (act === "select-opening") { S.circle.selectedOpening = !S.circle.selectedOpening; render(); return; }
  if (act === "reanchor") {
    const s = nearestStation(S.circle.eye);
    S.circle.anchorStation = s;
    toast(`Re-anchored to station ${fmt(s)} m — the station nearest your view`);
    render();
    return;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "u-slider") {
    S.circle.u = Number(e.target.value);
    render();
    return;
  }
  if (e.target.id === "door-offset") {
    const v = Number(e.target.value);
    if (Number.isFinite(v)) { S.circle.door.offset = wrap(v, S.circle.L); render(); }
    return;
  }
  if (e.target.id === "door-width") {
    const v = Number(e.target.value);
    if (Number.isFinite(v)) { S.circle.door.width = clamp(v, 0.6, 2.4); render(); }
  }
});

/* ------------------------------------------------------------------- boot */
resetWalls();
resetBend();
resetCircle();
render();
</script>
</body>
</html>
