<style>

lid var(--line);display:flex;gap:9px;align-items:center;padding:0 10px}.viewtab{border:0;border-radius:0;background:transparent;height:33px;font-size:12px;font-weight:bold}.viewtab.active{background:#e8ebed;border-bottom:2px solid #737e85}.viewbar .mode{font-size:10px;margin-left:13px;color:var(--muted)}.viewbar .modebtn{font-size:11px;height:24px}.viewbar .spacer{flex:1}.utility{font-size:10px;height:24px;padding:0 8px}.context,.ranges{height:34px;flex:none;display:flex;gap:10px;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);background:var(--instrument)}.context strong{font-size:12px}.context .context-meta{margin-left:auto;font:10px 'Andale Mono',monospace}.context .context-detail{font-size:11px;color:var(--muted)}.ranges .readout{color:var(--muted)}.ranges{background:#e1e3e3;font-size:10px;gap:14px}.ranges label{display:flex;gap:5px;align-items:center}.ranges input{height:24px;width:65px;font-size:10px}.ranges .spacer{flex:1}.ranges button{height:24px;font-size:10px}.paper-row{flex:1;display:flex;min-height:0}.tray{width:44px;flex:none;background:var(--instrument);border-right:1px solid var(--line);padding-top:10px}.tray small{display:block;text-align:center;font-size:7px;letter-spacing:.02em;margin:5px 0}.tray button,.tray .tool{display:flex;align-items:center;justify-content:center;flex-direction:column;width:42px;height:42px;gap:3px;padding:0;border:0;border-radius:0;background:transparent;font-size:8px}.tray button.armed{background:#cecac0;box-shadow:inset 0 1px #ada99f}.tray svg{width:19px;height:19px}.canvas{position:relative;background:var(--paper);width:772px;flex:1;overflow:hidden}.canvas svg{display:block;width:100%;height:100%}.canvas .paper-message{position:absolute;left:25px;right:25px;top:72px;font-size:12px;line-height:26px;background:var(--paper);border-bottom:1px solid var(--line);padding:0 0 12px}.paper-message button{float:right}.inspector{grid-column:4;grid-row:2;border-left:1px solid var(--line);overflow:auto}.identity{padding:17px 16px 14px;min-height:110px;border-bottom:1px solid var(--line)}.identity h2{font-size:15px;margin:0 0 8px}.identity p{margin:5px 0;font-size:11px}.identity .ref{font-size:10px}.inspector section{padding:15px 16px;border-bottom:1px solid var(--line)}.inspector h3{font-size:10px;letter-spacing:.06em;margin:0 0 13px;text-transform:uppercase}.property{display:flex;align-items:center;justify-content:space-between;min-height:33px;gap:10px}.property .readout{font-size:13px}.property small{font-size:10px}.inspector p{line-height:1.6;font-size:11px;margin:7px 0}.inspector .wide{width:100%;margin:7px 0 0}.warning{border-left:3px solid var(--invalid);padding-left:8px;color:var(--invalid)}.status{grid-column:2/5;grid-row:3;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:20px;font-size:10px;white-space:nowrap}.status .push{margin-left:auto}.notes{max-width:1440px;margin:0 auto 24px;background:#eef0ef;padding:22px 24px;border-top:2px solid #818c92}.notes h2{font-size:15px;margin:0 0 10px}.notes .columns{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.notes p{font-size:13px;line-height:1.6;margin:6px 0}.notes .tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.notes .practice{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.caption{max-width:1440px;margin:0 auto 8px;font-size:11px;display:flex;justify-content:space-between}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:700px){.atlas-head{padding:15px}.notes .columns{grid-template-columns:1fr}.stage-wrap{padding:10px}.notes{margin:0 10px 15px}#board{min-width:0;width:100%}}@media print{.atlas-head,.atlas-controls{display:none}.stage-wrap{padding:0}.notes{break-before:page}.frame{transform:none!important}.stage-slot{width:1440px!important;height:900px!important}@page{size:1440px 900px;margin:0}}
</style></head><body>
<header class="atlas-head"><div class="line"><h1>REGISTER</h1><span class="eyebrow">P26 independent direction · unratified · design simulation</span><a href="direction.md">Full interaction specification</a><a href="evidence.md">Inspected code evidence</a></div><p>Place a cut. Shape the real object. Return to the same place. A ceiling can cross a room boundary; its identity does not.</p><div class="atlas-controls"><label for="board">Scenario board</label><select id="board"></select><button id="prev" aria-label="Previous board">←</button><button id="next" aria-label="Next board">→</button><button id="reset">Reset demonstration</button><span class="push"></span><button id="scale" aria-pressed="false">View at 1:1</button></div></header>
<main><div class="stage-wrap"><div class="caption"><span id="caption"></span><span>PLATE · 1440 × 900 CSS px · all P26 behavior proposed</span></div><div class="stage-slot"><div class="frame" id="frame" aria-label="REGISTER 1440 by 900 editor design frame"></div></div></div><section class="notes" id="notes"></section></main>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={ink:'#252A2E',muted:'#697177',line:'#b1b8bd',paper:'#F5F7F8',cut:'#c4cacd',blue:'#2F8CFF',edge:'#145DA8',guide:'#146D68',bad:'#9B3149',pale:'#dce3e7'};
const boards=[
['section','S2 / S10','Section through the door','Section A','Head and sill belong to the opening, even where there is no solid.','Place a north–south cut through the door. Look east, span both rooms, set depth to 4.50 m. North’s east wall is included; East gallery is beyond the range.','The shared wall is cut only above the doorway. Drag or type the head; width is perpendicular to this cut and has no grip. The projected window redirects to its elevation.','Commit one opening edit. Return to Plan restores your location and selection. Undo restores the architectural value, not the view.'],
['entry','S1 / S2','Place the section','Place section','Three decisions, visible in the building.','Click the north endpoint, then the south endpoint through the door. The third click chooses east.','The translucent footprint previews finite depth. Endpoints own span. The arrow owns look direction. No architecture is created.','Open section. After return, only the quiet line and arrow remain until Edit cut is invoked.'],
['elevation','S3 / S7','Edit the shared opening','Wall Elevation','The same opening, now with honest width handles.','Select O-DOOR in Plan, then Open elevation. The host is W-SHARED; North and South are two faces of that one wall.','Width holds the opposite jamb. Sill holds head. Head holds sill. Type exact values in Inspector or activate a Paper grip.','Switch face without changing canonical offset. Return to Plan, Undo, then inspect the same opening in 3D.'],
['gable','S3','Shape a gable','Wall Elevation','Two eaves and one ridge. No arbitrary profile sketch.','Choose Gable on W-SHARED. The ridge begins at the midpoint, over the centered door.','Raise ridge to 4.20 m above floor, retain 3.20 m eaves. Station is measured from canonical start. The two room contexts reference one top.','Release commits one profile edit. Ridge-to-eave collision is refused; choose Slope explicitly to change form.'],
['arch','S3','Give the window a shallower arch','Wall Elevation','Arch rise becomes a real authored value.','Open W-EAST from O-WINDOW. Existing width is 1.80 m, sill 1.10, head 2.30, rounded rise 0.90.','Move spring line upward to make rise 0.45. Head stays fixed. This requires a new shared profile parameter; it is not shipped behavior.','Validate the full top contour against the host, then commit. A change of rise updates Plan, elevation, 3D and visitor through one compiler.'],
['curve','S3','Follow a curved partition','Wall Elevation','A truthful tangent, with arc-length measurements.','Open the curved partition. The plane follows the wall tangent at canonical station 2.40 m.','Move a bend in Plan and Resume. The wall-derived tangent follows; the station and opening remain canonical. Width and station use Inspector arc length, never screen width.','Vertical station handles remain exact. Use Locate in Plan for jambs or profile stations; no flattened projection is passed off as an elevation.'],
['spanning','S5','Create one spanning ceiling','Ceiling footprint','Two room seeds. One independent region.','Use room outline, then add South to North’s seed. Preview 8 × 11 m; the shared wall is not a ceiling boundary.','Choose Closure, Shed, high edge on the south exterior. Low underside Y=3.55, high Y=4.55, thickness 0.15.','Create one C-SPAN. The footprint is now independent of rooms. Open profile section to see actual gaps and contacts.'],
['ceiling-section','S5','Read the spanning shed','Section A','A continuous ceiling does not silently lift a wall.','C-SPAN replaces generated overhead over its footprint. Its underside rises from North Y=3.55 to South Y=4.55.','At the shared wall the underside is about Y=4.095. The wall top remains Y=3.35: the ~0.745 m gap is real.','Set a wall profile and snap to ceiling intersections if you want contact. This is a one-time value edit, not persistent attachment.'],
['ceiling-three','S5','Prove the ceiling in 3D','3D','One spanning underside; the gap stays real.','Inspect C-SPAN above the two galleries. This is an editor cutaway, not a visitor-facing section tool.','The ceiling bridges the shared wall without duplicating it. Only the selected ceiling gets a whole-surface lift; the air gap remains visible.','A suspended piece retains closure above it. Profile precision returns to Section; footprint changes return to Plan.'],
['multiple','S5','Partial coverage and two regions','Ceiling footprint','Overhead coverage is not room ownership.','C-FLAT and C-GABLE occupy North only. South still has generated closure at Y=3.35.','North’s east 1 m strip remains generated at Y=4.35. The regions overlap in footprint by 0.50 m. Different heights can coexist.','Inspect overlap in Section. A solid intersection asks for an explicit joint; mere footprint overlap is legal.'],
['joint','S5','Resolve a physical intersection','Section B','Keep both sources; decide who keeps the material.','Two ceiling solids overlap by 0.50 m. The candidate crossing is marked, not automatically merged.','Trim C-GABLE against C-FLAT retains C-FLAT’s material. C-GABLE’s cut faces remain its own. Directional relationships must be acyclic.','A valid joint commits once. A separated stack needs no trim. A wholly removed region or a cyclic joint remains a refused proposal.'],
['focus','S5','Inspect overhead with a real datum','Ceiling Focus','Look up from Y=1.75. Do not infer the cut from the ceiling.','Default cut is floor Y=0.15 + 1.60 m. The upward view uses an explicit reflected policy.','North remains up; east appears left here. Labels remain upright. Select C-GABLE, inspect overlapping overhead and raise its whole underside.','Edit footprint returns to Plan. Open profile section gives precise ridge/eave editing. South’s generated ceiling remains recognizable.'],
['dense-plan','S4','The complete twelve-room wing','Plan','Every source remains discoverable.','Three rows by four columns, each room 6 × 5 m, shared walls, two door incidences and one window per room. Four rooms share the name Gallery.','Physical wall heights alternate 3.0 and 4.2 m. A curved southern boundary belongs to S4. The cut passes column 2 and looks east.','The 6 m finite volume intersects column 2 and column 3 room contexts. Column 1 is behind and column 4 is beyond depth. Open the section to compare.'],
['dense','S4','Twelve rooms, one legible cut','Section A','Six room contexts included. Six excluded with reasons.','Cut through column 2, north–south, looking east. Finite depth is 6 m; column 3 projects into the view.','Column 1 is behind. Column 4 is beyond depth. The map shows all twelve rooms and repeated names retain references.','Reveal O-N4 admits that opening plus necessary host context only. It does not admit all of column 4. Restore view reverses only that visit.'],
['excluded','S6','Keep an excluded selection','Section A','Outside depth is a reason, not a lost object.','Shorten S2 depth to 2.00 m with O-WINDOW selected. It stays in Navigator and Inspector.','Reveal temporarily reaches that source at its true projected position. Other newly reached sources stay excluded.','Edit sill in Inspector, Undo the edit, then Restore view. Undo and view restoration are deliberately independent.'],
['crop','S6','A cropped feature retains identity','Section A','The door is partly visible; its sill is below crop.','Set minimum crop Y=1.00. Door head remains visible. Sill Y=0.15 is outside crop.','A feature-specific reason explains the missing grip. Reveal can lower the crop temporarily without dropping the target.','Restore view reinstates the crop. Neither action writes architectural history.'],
['return','S7','Return with the same opening','Plan','Your location and selection survive the visit.','Return from elevation. O-DOOR is still selected in the plan and named in the Inspector.','The temporary cut is quiet. No active vertical dimension forest appears in Plan. Undo remains global.','Switch to 3D for spatial proof. Opening selection survives; precision editing points back to elevation.'],
['three','S7 / S8','Spatial proof and coarse handles','3D','One selected source. One appropriate handle set.','The door is selected in 3D with no arch, jamb or profile-point gizmos. Open elevation is the precision action.','A selected wall or ceiling would expose one vertical lift; a column gets top height; a platform lifts at fixed thickness.','These are Layout edits through the existing gizmo host. Camera paths and visitor motion are untouched.'],
['objects','S8','Structure, walking surface, passive art','Section C','Architectural meaning decides ownership.','Column: 0.40 × 0.40 m, base Y=0.15, top Y=3.35. Platform: 3 × 2 m, top Y=0.60, thickness 0.20.','The platform base is Y=0.40, so the air below it is visible. Its source remains selectable beside the wall.','The artwork on a plinth is passive Scene context. It cannot be selected for an architectural transform here.'],
['invalid','S9','Refuse an opening above its host','Wall Elevation','A failed proposal does not change the building.','Raise the door head above the 3.20 m wall. The candidate is dashed in refusal ink while the accepted wall remains.','The reason is attached to the operation: Head crosses wall top. Correct the field, lower the grip, or cancel.','Release of an invalid drag writes nothing. A typed invalid field remains editable. No automatic wall lift.'],
['ridge','S9','Refuse a collapsed gable','Wall Elevation','A ridge must remain a ridge.','Drag the ridge station onto the east eave. The last committed gable remains visible beneath the candidate.','Ridge must sit between the eaves and above them. Move it inward or choose Slope.','No automatic shape conversion, point deletion or topology repair. Escape discards the candidate.'],
['deleted','S3 / S9','Recover a missing elevation host','Wall Elevation','The instrument does not keep a stale editable face.','Delete W-SHARED from Navigator using the normal validated operation. The host disappears.','The instrument names the missing reference and clears its handles. Undo deletion is a Layout action.','Undo restores the same identity and its elevation. Return to Plan is available without undoing the deletion.'],
['oblique','S3 / S9','Redirect an edge-on target','Wall Elevation','The Inspector follows selection; the plane does not lie.','While W-SHARED elevation is open, select O-WINDOW on W-EAST. It is edge-on in this instrument.','No width grip appears. The action says Open W-EAST elevation, not Increase depth.','The new plane derives from W-EAST; Back returns to the previous instrument. Return to Plan remains visible.'],
['empty','S9','An empty project','Place section','A useful empty state points to architecture.','Section is armed on an empty Paper. There are no surfaces to imply or invent.','Draw wall begins normal Plan architecture. Cancel section returns to selection. A coordinate-defined empty cut remains possible.','A section through nothing is not a building and creates no Layout history.'],
['miss','S9','A cut that misses','Section A','No intersection means no cut poche.','The line misses every wall. Projected context may still exist within its range.','Nothing intersects this cut. Edit cut changes its location; Fit included context changes framing only.','If scope is empty too, keep the same clear recovery. Never fabricate a room or floor surface.'],
['unclosed','S9','An unfinished ceiling outline','Ceiling footprint','An open loop is a draft.','Draw a partial room-free footprint. The trailing edge stays dashed, and no ceiling is installed.','Close the outline to create. Click the first point, use Backspace to remove a point, or Escape to cancel.','Creation and profile/closure choices are accepted together as one validated transaction.'],
['stretch','S9','Do not imply a room-stretch solver','Plan','Select the boundary you intend to change.','A creator attempts to select two rooms and drag a wing. REGISTER introduces no multi-room stretch handles.','Room stretching is not available. Edit boundary walls in Plan. Existing room-unit movement is a different operation.','No junction duplication, shared-wall splitting or topology repair is hidden inside a vertical tool.']
];
let state={outlineClosed:false,board:'section',target:'O-DOOR',windowHead:2.3,windowWidth:1.8,focusCut:1.75,ceilingCreated:false,head:2.10,sill:0,width:1,windowSill:1.10,depth:4.5,reveal:false,cutOnly:false,face:'North',joint:false,curve:false,history:[],message:'O-DOOR selected · floor datum Y +0.15',native:false};
const board=()=>boards.find(b=>b[0]===state.board);
const isWindow=()=>state.target==='O-WINDOW', isCeiling=()=>state.target.startsWith('C-'), isPlan=()=>['entry','spanning','multiple','return','empty','unclosed','stretch','dense-plan'].includes(state.board);
const selectedRef=()=>state.target;
const faceLabel=()=>state.board==='arch'?(state.face==='North'?'West':'East'):state.face;
const targetFor=id=>id==='empty'?'':id==='unclosed'?'DRAFT':['arch','oblique','excluded'].includes(id)?'O-WINDOW':['spanning','ceiling-section','ceiling-three'].includes(id)?'C-SPAN':['multiple','joint','focus'].includes(id)?'C-GABLE':['dense','dense-plan'].includes(id)?'W-N2M2':['gable','ridge','deleted'].includes(id)?'W-SHARED':id==='curve'?'W-CURVE':id==='objects'?'P-PLAT':'O-DOOR';
const txt=(x,y,t,cls='',anchor='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(t)}</text>`;
const line=(x1,y1,x2,y2,cls='edge')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
const rect=(x,y,w,h,cls='cut')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"/>`;
const path=(d,cls='edge')=>`<path d="${d}" class="${cls}"/>`;
const grip=(x,y,action,label)=>`<g role="button" tabindex="0" aria-label="${label}" data-action="${action}" class="grip">${rect(x-5,y-5,10,10,'handle')}<title>${label}</title></g>`;
const dim=(x1,y1,x2,y2,label,side='right')=>line(x1,y1,x2,y2,'dimension')+line(x1-4,y1-4,x1+4,y1+4,'dimension')+line(x2-4,y2-4,x2+4,y2+4,'dimension')+(x1===x2?txt(side==='left'?x1-8:x1+8,(y1+y2)/2+4,label,'measure',side==='left'?'end':'start'):txt((x1+x2)/2,(y1+y2)/2-8,label,'measure','middle'));
const svg=(body,view='0 0 772 738',label='Spatial design drawing')=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view}" role="img" aria-label="${esc(label)}"><style>text{font:12px 'Trebuchet MS',sans-serif;fill:${C.ink}}.meta{font-size:10px;fill:${C.muted};letter-spacing:.035em}.title{font-size:15px;font-weight:bold}.measure{font:11px 'Andale Mono',monospace;fill:${C.edge}}.small{font-size:10px}.note{fill:${C.muted};font-size:11px}.blueText{fill:${C.edge}}.badText{fill:${C.bad}}.guideText{fill:${C.guide}}.cut{fill:${C.cut};stroke:${C.ink};stroke-width:2}.edge{fill:none;stroke:${C.ink};stroke-width:1.4}.projected{fill:none;stroke:${C.muted};stroke-width:1}.far{fill:none;stroke:#adb7be;stroke-width:1}.hidden{fill:none;stroke:#89949d;stroke-width:1;stroke-dasharray:5 4}.selected{fill:none;stroke:${C.blue};stroke-width:2.5}.selectedFill{fill:#2f8cff0c;stroke:${C.blue};stroke-width:2}.guide{fill:none;stroke:${C.guide};stroke-width:1;stroke-dasharray:4 4}.dimension{fill:none;stroke:#8d9aa5;stroke-width:1}.handle{fill:${C.paper};stroke:${C.edge};stroke-width:1.7;rx:1}.bad{fill:#9b314912;stroke:${C.bad};stroke-width:1.8;stroke-dasharray:6 4}.paper{fill:${C.paper};stroke:none}.cutContext{fill:#d9dfe4;stroke:#65717b;stroke-width:1}.wash{fill:#dbe1e555;stroke:#aeb8bf;stroke-width:1}.volume{fill:#146d680a;stroke:${C.guide};stroke-width:1;stroke-dasharray:5 4}.grip{cursor:pointer}.grip:focus{outline:none}.grip:focus .handle{stroke:${C.ink};stroke-width:3}.ceiling{fill:#dce3e7;stroke:#485a66;stroke-width:1.7}.symbol{fill:none;stroke:${C.ink};stroke-width:1;stroke-dasharray:2 3}</style>${body}</svg>`;

if(k==='focus')return ctx(ret,'Ceiling Focus','Looking up · reflected',meta('REGISTERED TO PLAN'))+`<div class="ranges"><label>Cut Y <input aria-label="Ceiling Focus cut height" id="depth" type="number" step="any" value="${state.focusCut.toFixed(2)}"> m</label>${readout(`floor +${(state.focusCut-.15).toFixed(2)}`)}${readout(`up 5.00 m → Y ${(state.focusCut+5).toFixed(2)}`)}${button('Reset to floor +1.60','resetCut')}<span class="spacer"></span>${fit}</div>`;
if(k==='curve')return ctx(ret,'Wall Elevation','W-CURVE · tangent',meta('REGISTERED TO PLAN'))+`<div class="ranges">${readout('Station 2.40 m · arc length')}${button('Locate in Plan','return')}<span class="spacer"></span>${readout('Background 0.30 m')}${fit}</div>`;
if(k==='elevation'){const host=id==='arch'?'W-EAST':'W-SHARED';return ctx(ret,'Wall Elevation',`${host} · ${faceLabel()} face`,meta('REGISTERED TO PLAN'))+`<div class="ranges">${id==='deleted'?readout('Host unavailable'):button(`${faceLabel()} face ⇄`,'face')}${readout('Background 0.30 m')}${button('Crop…','crop')}<span class="spacer"></span>${fit}</div>`;}
return ctx(ret,instrumentName(),id==='objects'?'Looking north':mapKind()==='sectionB'?'Normal to C-GABLE ridge · looking east':'Looking east',meta('REGISTERED TO PLAN'))+`<div class="ranges"><label>Depth <input aria-label="Instrument range" id="depth" type="number" step="any" value="${state.depth.toFixed(2)}"> m</label>${button(state.cutOnly?'✓ Cut only':'Cut only','cutOnly')}${button(id==='crop'&&!state.reveal?'Crop Y ≥ 1.00':'Crop…','crop')}${button('Edit cut in Plan','entry')}<span class="spacer"></span>${state.reveal?button('Restore view','restore'):id==='dense'?button('Reveal O-N4','reveal'):['excluded','crop'].includes(id)?button('Reveal','reveal'):fit}</div>`;}
function render(){let b=board(),plan=isPlan(),three=['three','ceiling-three'].includes(state.board);$('#board').value=state.board;$('#caption').textContent=`REGISTER / ${b[1]} / ${b[2]}`;
$('#frame').innerHTML=`<aside class="spine"><div class="station active">${icon('scene')}Scene</div><div class="station">${icon('camera')}Camera</div></aside><header class="head"><span>‹ Projects</span><strong>${state.board==='empty'?'Untitled project':['dense','dense-plan'].includes(state.board)?'Twelve-room wing':'Two galleries'}</strong><span>Local session</span><span class="grow"></span>${button('↶ Undo','undo')}${button('↷ Redo','redo')}<span>Design specimen</span><span class="head-action">Spatial</span><span class="head-action">Publish</span><span class="head-action">Preview</span><span class="head-action">PLATE Light</span><span>Account</span></header><aside class="navigator">${nav()}</aside><section class="work"><div class="viewbar"><button class="viewtab ${!three?'active':''}" data-action="return">Plan</button><button class="viewtab ${three?'active':''}" data-action="three">3D</button><span class="mode">MODE</span><span class="modebtn">Layout</span><span class="muted">Arrange</span><span class="spacer"></span><span class="eyebrow">Snap .10</span><span class="eyebrow">Grid</span><span class="eyebrow">Panels</span></div>${three?'':hostRows()}<div class="paper-row"><aside class="tray"><small>EDIT</small><button class="${armedTool()==='select'?'armed':''}" aria-pressed="${armedTool()==='select'}" data-action="return" aria-label="Select tool">${icon('select')}Select</button><small>INSPECT</small><button class="${armedTool()==='section'?'armed':''}" aria-pressed="${armedTool()==='section'}" data-action="entry" aria-label="Section tool">${icon('section')}Section</button><button data-action="elevation" aria-label="Elevation tool">${icon('wall')}Elevation</button><button class="${armedTool()==='ceiling'?'armed':''}" aria-pressed="${armedTool()==='ceiling'}" data-action="focus" aria-label="Ceiling tool: create regions or focus overhead">${icon('ceiling')}Ceiling</button><small>MEASURE</small><div class="tool">${icon('measure')}Measure</div></aside><div class="canvas">${svg(draw(),'0 0 772 738',`${b[1]} ${b[2]}`)}${message()}</div></div></section><aside class="inspector">${inspector()}</aside><footer class="status"><span>Scene · ${three?'3D':plan?'Plan · Layout':`Plan › ${instrumentName()}`}</span><span class="mono">${displayRef()}</span><span id="status-message" role="status">${esc(state.message)}</span><span class="push mono">Y datum +0.15 · ${state.history.length} demo edits</span></footer>`;
$('#notes').innerHTML=`<h2>${b[1]} · ${b[4]}</h2><div class="columns"><div><div class="tag">Entry</div><p>${b[5]}</p></div><div><div class="tag">Active editing / failure</div><p>${b[6]}</p></div><div><div class="tag">Commit / return</div><p>${b[7]}</p></div></div><div class="practice"><b>Try the prototype:</b> change head or sill in the Inspector and commit, click a blue opening grip to focus its exact field, use Undo, then Return to Plan. On S6 use Reveal and Restore view independently of Undo. On S5 Joint choose Trim. These are bounded design simulations; the other boards are annotated states, not a geometry implementation. <a href="direction.md">Full rules and owner decisions →</a></div>`;
const form=$('#values');if(form){form.addEventListener('submit',e=>{e.preventDefault();let data=new FormData(form),h=Number(data.get('head')),s=Number(data.get('sill')),w=Number(data.get('width'));if(!Number.isFinite(h+s+w)||h<=s||s<0||h>3.2||w<=0||w>(isWindow()?6:8)){state.message='Refused · head must fit host; sill ≥ 0; width > 0';$('#status-message').textContent=state.message;form.querySelector('[name=head]').setAttribute('aria-invalid','true');return;}const before={head:state.head,sill:state.sill,width:state.width,windowSill:state.windowSill,windowHead:state.windowHead,windowWidth:state.windowWidth};if(isWindow()){if(s===state.windowSill&&h===state.windowHead&&w===state.windowWidth){state.message='No change · no history entry';render();return;}Object.assign(state,{windowSill:s,windowHead:h,windowWidth:w});}else{if(h===state.head&&s===state.sill&&w===state.width){state.message='No change · no history entry';render();return;}Object.assign(state,{head:h,sill:s,width:w});}state.history.push(before);state.redo=null;state.message='Committed opening edit · one Layout transaction';render();});form.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();state.message='Draft cancelled · document unchanged';render();}});}
$('#depth')?.addEventListener('change',e=>{let d=Number(e.target.value);if(d<=0||!Number.isFinite(d)){state.message='Range must be finite and positive';render();return;}if(state.board==='focus'){state.focusCut=d;state.message=`Cut height Y ${d.toFixed(2)} · instrument only`;render();return;}state.depth=d;state.reveal=false;state.message=`Range changed · zero Layout history${instrumentKind()==='section'&&d<4?' · O-WINDOW now outside depth':''}`;render();});
$('#search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.navrow').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none');});resize();}
function go(id){state.board=id;state.target=targetFor(id);state.reveal=false;state.outlineClosed=false;state.message=`${board()[1]} · ${displayRef()==='—'?'nothing selected':`${displayRef()} selected`} · datum Y +0.15`;state.depth=id==='excluded'?2:['dense','dense-plan'].includes(id)?6:id==='empty'?5:4.5;render();}
function act(a){if(a==='focus'&&isCeiling()){state.board='focus';state.message=`${state.target} retained · reflected instrument`;render();return;}if(a==='elevation'&&state.target==='W-N2M2'){state.message='W-N2M2 elevation is not drawn in this atlas · see the S3 elevation boards';render();return;}if(a==='elevation'&&state.target.startsWith('W-')){state.board=state.target==='W-CURVE'?'curve':'gable';state.message=`${state.target} retained · wall elevation`;render();return;}if(a==='return'||a==='three'){state.board=(a==='three'&&isCeiling())?'ceiling-three':a;state.reveal=false;state.message=`${state.target} retained · view changed, architecture unchanged`;render();return;}if(a==='crop'&&instrumentKind()!=='section'){state.message='Vertical crop brackets · absolute-Y fields in this host (S6 shows the section case)';render();return;}if(boards.some(b=>b[0]===a)){go(a);return;}if(['head','sill','width'].includes(a)){let el=document.querySelector(`[name=${a}]`);if(el){el.focus();el.select();}return;}switch(a){case'reveal':state.reveal=true;state.message='One source revealed · no Layout history';break;case'restore':state.reveal=false;state.message='Previous view restored · architecture unchanged';break;case'undo':{let prev=state.history.pop();if(prev){state.redo={head:state.head,sill:state.sill,width:state.width,windowSill:state.windowSill,windowHead:state.windowHead,windowWidth:state.windowWidth};Object.assign(state,prev);state.message='Opening edit undone · view unchanged';}else state.message='No demonstration edit to undo';break;}case'redo':if(state.redo){state.history.push({head:state.head,sill:state.sill,width:state.width,windowSill:state.windowSill,windowHead:state.windowHead,windowWidth:state.windowWidth});Object.assign(state,state.redo);state.redo=null;state.message='Opening edit restored · view unchanged';}break;case'face':state.face=state.face==='North'?'South':'North';state.message='Opposite face · same W-SHARED and O-DOOR';break;case'cutOnly':state.cutOnly=!state.cutOnly;state.message='Projection policy changed · no Layout history';break;case'fit':state.message='Included geometry fitted · ranges unchanged';break;case'createCeiling':state.ceilingCreated=true;state.message='C-SPAN created · one proposed Layout transaction';break;case'trimJoint':state.joint=true;state.message='Explicit trim accepted · both canonical sources retained';break;case'undoJoint':state.joint=false;state.message='Joint returned to proposal state';break;case'bend':state.curve=!state.curve;state.message='Tangent follows the changed canonical curve';break;case'footprint':state.board=state.target==='C-SPAN'?'spanning':'multiple';state.message=`${state.target} retained · footprint in Plan`;break;case'ceilingSection':state.board='ceiling-section';state.message=`${state.target} retained · profile section`;break;case'closeOutline':state.outlineClosed=true;state.message='Outline closed · still a draft, no Layout history';break;case'createDraft':state.message='Create would validate and commit one Layout transaction · illustrated only';break;case'cancelSection':state.message='Section cancelled · nothing was created';break;case'cancelCeiling':state.message='Ceiling tool cancelled · draft discarded, no Layout history';break;case'discard':state.message='Section A discarded · quiet line removed, no Layout history';break;case'resetCut':state.focusCut=1.75;state.message='Cut reset to floor +1.60 (Y 1.75) · instrument only';break;case'recover':go('gable');state.message='Deletion undone · W-SHARED identity and selection restored';break;case'drawWall':go('entry');state.message='Illustrated next step · ordinary Plan wall authoring';break;case'rise':state.message='Rise 0.45 m specimen · new authored profile capability';break;case'ceilingLift':state.message='Whole-underside lift preserves profile · use profile section for eaves';break;case'platform':state.message='Top lift preserves 0.20 m thickness';break;}render();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t)act(t.dataset.action);});document.addEventListener('keydown',e=>{const t=e.target.closest('[data-action]');if(t&&t.tagName.toLowerCase()==='g'&&['Enter',' '].includes(e.key)){e.preventDefault();act(t.dataset.action);}});
$('#board').innerHTML=boards.map(b=>`<option value="${b[0]}">${b[1]} · ${b[2]}</option>`).join('');$('#board').addEventListener('change',e=>go(e.target.value));$('#prev').onclick=()=>go(boards[(boards.findIndex(b=>b[0]===state.board)+boards.length-1)%boards.length][0]);$('#next').onclick=()=>go(boards[(boards.findIndex(b=>b[0]===state.board)+1)%boards.length][0]);$('#reset').onclick=()=>{Object.assign(state,{head:2.1,sill:0,width:1,windowSill:1.1,windowHead:2.3,windowWidth:1.8,target:'O-DOOR',focusCut:1.75,history:[],redo:null,reveal:false,joint:false,curve:false,cutOnly:false,face:'North',ceilingCreated:false,outlineClosed:false});go('section');};$('#scale').onclick=()=>{state.native=!state.native;$('#scale').setAttribute('aria-pressed',state.native);$('#scale').textContent=state.native?'Fit frame to window':'View at 1:1';resize();};function resize(){let width=Math.max(320,window.innerWidth-40),scale=state.native?1:Math.min(1,width/1440);$('.stage-slot').style.width=`${1440*scale}px`;$('.stage-slot').style.height=`${900*scale}px`;$('#frame').style.transform=`scale(${scale})`;}window.addEventListener('resize',resize);render();
</script></body></html>
