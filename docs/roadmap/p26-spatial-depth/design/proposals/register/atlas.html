const C={ink:'#252A2E',muted:'#697177',line:'#b1b8bd',paper:'#F5F7F8',cut:'#c4cacd',blue:'#2F8CFF',edge:'#145DA8',guide:'#146D68',bad:'#9B3149',pale:'#dce3e7'};
const boards=[
['section','S2 / S10','Section through the door','Section A','Head and sill belong to the opening, even where there is no solid.','Place a north–south cut through the door. Look east, span both rooms, set depth to 4.50 m. North’s east wall is included; East gallery is beyond the range.','The shared wall is cut only above the doorway. Drag or type the head; width is perpendicular to this cut and has no grip. The projected window redirects to its elevation. Both drawn ceiling gaps come from one rule: derived closure sits at the maximum boundary-wall height.','Commit one opening edit. Return to Plan restores your location and selection. Undo restores the architectural value, not the view.'],
['entry','S1 / S2','Place the section','Place section','Three decisions, visible in the building.','Click the north endpoint, then the south endpoint through the door. The third click chooses east.','The translucent footprint previews finite depth. Endpoints own span. The arrow owns look direction. No architecture is created.','Open section. After return, only the quiet line and arrow remain until Edit cut is invoked.'],
['editcut','S1 / S2','Edit the cut you placed','Plan','A committed range, not a new placement.','Resume the section: its endpoints, look arrow and depth edge reappear in Plan as range controls.','Drag an endpoint to change span, the depth edge to change depth, and click the arrow to flip direction about the same line. Depth is also a field here.','Resume section returns to the instrument. Discard section removes the range. Neither writes Layout history.'],
['elevation','S3 / S7','Edit the shared opening','Wall Elevation','The same opening, now with honest width handles.','Select O-DOOR in Plan, then Open elevation. The host is W-SHARED; North and South are two faces of that one wall.','Width holds the opposite jamb. Sill holds head. Head holds sill. Type exact values in Inspector or activate a Paper grip.','Switch face without changing canonical offset. Return to Plan, Undo, then inspect the same opening in 3D.'],
['gable','S3','Shape a gable','Wall Elevation','Two eaves and one ridge. No arbitrary profile sketch.','Choose Gable on W-SHARED. The ridge begins at the midpoint, over the centered door.','Raise ridge to 4.20 m above floor, retain 3.20 m eaves. Station is measured from canonical start. The two room contexts reference one top.','Release commits one profile edit. Ridge-to-eave collision is refused; choose Slope explicitly to change form.'],
['arch','S3','Give the window a shallower arch','Wall Elevation','Arch rise becomes a real authored value.','Open W-EAST from O-WINDOW. Existing width is 1.80 m, sill 1.10, head 2.30, rounded rise 0.90.','Move spring line upward to make rise 0.45. Head stays fixed. This requires a new shared profile parameter; it is not shipped behavior.','Validate the full top contour against the host, then commit. A change of rise updates Plan, elevation, 3D and visitor through one compiler.'],
['curve','S3','Follow a curved partition','Wall Elevation','A truthful tangent, with arc-length measurements.','Open the curved partition. The plane follows the wall tangent at its canonical midpoint, so the face is foreshortened.','Move a bend in Plan and Resume: the tangent follows the changed canonical curve and the image changes with it. Width and station use Inspector arc length, never screen width.','Vertical station handles remain exact. Use Locate in Plan for jambs or profile stations; no flattened projection is passed off as an elevation.'],
['spanning','S5','Create one spanning ceiling','Ceiling footprint','Two room seeds. One region, still a draft.','Use room outline, then add South to North’s seed. Preview 8 × 11 m; the shared wall is not a ceiling boundary.','Choose Closure, Shed, high edge on the south exterior. Low underside Y=3.55, high Y=4.55, thickness 0.15. The Navigator says “draft”, not a region, until Create.','Create one C-SPAN · one Layout transaction. The footprint is then independent of rooms. Open profile section to see actual gaps and contacts.'],
['ceiling-section','S5','Read the spanning shed','Section A','A continuous ceiling does not silently lift a wall.','C-SPAN replaces generated overhead over its footprint. Its underside rises from North Y=3.55 to South Y=4.55.','At the shared wall the underside is about Y=4.095 and the wall top stays Y=3.35: the ~0.745 m gap is real. The high south edge Y 4.55 is 1.60 m above South’s 2.95 m wall, and North’s 4.35 m wall crosses 0.80 m through the low edge.','Set a wall profile and snap to ceiling intersections if you want contact. This is a one-time value edit, not persistent attachment.'],
['ceiling-three','S5','Prove the ceiling in 3D','3D','One spanning underside; the gap stays real.','Inspect C-SPAN above the two galleries. This is an editor cutaway, not a visitor-facing section tool.','The ceiling bridges the shared wall without duplicating it: one source, one history entry. The 0.745 m, 1.60 m and 0.80 m conditions are visible, not repaired.','A suspended piece retains closure above it. Profile precision returns to Section; footprint changes return to Plan.'],
['multiple','S5','Partial coverage and two regions','Ceiling footprint','Overhead coverage is not room ownership.','C-FLAT and C-GABLE occupy North only. South still has generated closure at Y=3.35.','North’s east 1 m strip remains generated at Y=4.35. The regions overlap in footprint by 0.50 m. Different heights can coexist.','Inspect overlap in Section. A solid intersection asks for an explicit joint; mere footprint overlap is legal.'],
['joint','S5','Resolve a physical intersection','Section B','Keep both sources; decide who keeps the material.','The footprint overlap is 0.50 m; the solids themselves cross for 0.35 m of it. The candidate crossing is marked, never merged automatically.','Trim C-GABLE against C-FLAT retains C-FLAT’s material. C-GABLE’s cut faces remain its own. Directional relationships must be acyclic.','A valid joint commits once. A separated stack needs no trim. A wholly removed region or a cyclic joint remains a refused proposal.'],
['focus','S5','Inspect overhead with a real datum','Ceiling Focus','Look up from Y=1.75. Do not infer the cut from the ceiling.','Default cut is floor Y=0.15 + 1.60 m. The upward view uses an explicit reflected policy.','North remains up; east appears left here. Labels remain upright. Select C-GABLE, inspect overlapping overhead and raise its whole underside.','Edit footprint returns to Plan. Open profile section gives precise ridge/eave editing. South’s generated ceiling remains recognizable.'],
['dense-plan','S4','The complete twelve-room wing','Plan','Every source remains discoverable.','Three rows by four columns, each room 6 × 5 m, shared walls, two door incidences and one window per room. Four rooms share the name Gallery.','Physical wall heights alternate 3.0 and 4.2 m. A curved southern boundary belongs to S4. The cut passes column 2 and looks east.','The 6 m finite volume intersects column 2 and column 3 room contexts. Column 1 is behind and column 4 is beyond depth. Open the section to compare.'],
['dense','S4','Twelve rooms, one legible cut','Section A','Six room contexts included. Six excluded with reasons.','Cut through column 2, north–south, looking east. Finite depth is 6 m; column 3 projects into the view.','Column 1 is behind. Column 4 is beyond depth. Repeated “Gallery” rooms keep R-references; the selected wall carries W-N2M2 and both room relationships.','Every source stays discoverable. Reveal is offered only for an excluded selection, so this board keeps the wall and the next board reveals a source.'],
['dense-reveal','S4','Reveal one source, not one column','Section A','One excluded source can be inspected without widening the wing.','Select O-N4, a window in column 4, from search while it is outside the 6 m depth.','Reveal admits this source at its true projected station plus the host wall needed to read it. Column 4’s other rooms, walls and openings stay excluded.','Restore view reverses the visit and leaves selection and history untouched. Depth is unchanged at 6.00 m.'],
['excluded','S6','Keep an excluded selection','Section A','Outside depth is a reason, not a lost object.','Shorten S2 depth to 2.00 m with O-WINDOW selected. It stays in Navigator and Inspector.','Reveal temporarily reaches that source at its true projected position. Only sources within 2.00 m of the cut stay drawn: the prop at 4.90 m remains, the curved partition and O-WINDOW leave.','Edit sill in Inspector, Undo the edit, then Restore view. Undo and view restoration are deliberately independent.'],
['crop','S6','A cropped feature retains identity','Section A','The door is partly visible; its sill is below crop.','Set minimum crop Y=1.00. Door head remains visible. Sill Y=0.15 is outside crop.','A feature-specific reason explains the missing grip: the sill grip is not offered below the crop. Reveal can lower the crop temporarily without dropping the target.','Restore view reinstates the crop. Neither action writes architectural history.'],
['return','S7','Return with the same opening','Plan','Your location and selection survive the visit.','Return from elevation. O-DOOR is still selected in the plan and named in the Inspector.','The temporary cut is quiet. No active vertical dimension forest appears in Plan. Undo remains global.','Switch to 3D for spatial proof. Opening selection survives; precision editing points back to elevation.'],
['three','S7 / S8','Spatial proof and coarse handles','3D','One selected source. One appropriate handle set.','The door is selected in 3D with no arch, jamb or profile-point gizmos. Open elevation is the precision action.','A selected wall or ceiling would expose one vertical lift; a column gets top height; a platform lifts at fixed thickness.','These are Layout edits through the existing gizmo host. Camera paths and visitor motion are untouched.'],
['objects','S8','Structure, walking surface, passive art','Section C','Architectural meaning decides ownership.','Column: 0.40 × 0.40 m, base Y=0.15, top Y=3.35. Platform: 3 × 2 m, top Y=0.60, thickness 0.20.','The platform base is Y=0.40, so the air below it is visible. Its source remains selectable beside the wall.','The artwork on a plinth is passive Scene context. It cannot be selected for an architectural transform here.'],
['invalid','S9','Refuse an opening above its host','Wall Elevation','A failed proposal does not change the building.','Raise the door head above the 3.20 m wall. The candidate is dashed in refusal ink while the accepted wall remains.','The reason is attached to the operation: Head crosses wall top. Correct the field, lower the grip, or cancel.','Release of an invalid drag writes nothing. A typed invalid field remains editable. No automatic wall lift.'],
['ridge','S9','Refuse a collapsed gable','Wall Elevation','A ridge must remain a ridge.','Drag the ridge station onto the east eave. The last committed gable remains visible beneath the candidate.','Ridge must sit between the eaves and above them. Move it inward or choose Slope.','No automatic shape conversion, point deletion or topology repair. Escape discards the candidate.'],
['deleted','S3 / S9','Recover a missing elevation host','Wall Elevation','The instrument does not keep a stale editable face.','Delete W-SHARED from Navigator using the normal validated operation. The host disappears.','The instrument names the missing reference and clears its face, handles and background. The deletion is one Layout transaction.','Global Undo restores the same identity and its elevation. Return to Plan is available without undoing the deletion.'],
['oblique','S3 / S9','Redirect an edge-on target','Wall Elevation','The Inspector follows selection; the plane does not lie.','While W-SHARED elevation is open, select O-WINDOW on W-EAST. It is edge-on in this instrument.','No width grip appears. The action says Open W-EAST elevation, not Increase depth.','The new plane derives from W-EAST; Back returns to the previous instrument. Return to Plan remains visible.'],
['empty','S9','An empty project','Place section','A useful empty state points to architecture.','Section is armed on an empty Paper. There are no surfaces to imply or invent.','Draw wall begins normal Plan architecture. Cancel section returns to selection. A coordinate-defined empty cut remains possible.','A section through nothing is not a building and creates no Layout history.'],
['miss','S9','A cut that misses','Section A','No intersection means no cut poche.','The line misses every wall. Projected context may still exist within its range.','Nothing intersects this cut. Edit cut changes its location; Fit included context changes framing only.','If scope is empty too, keep the same clear recovery. Never fabricate a room or floor surface.'],
['unclosed','S9','An unfinished ceiling outline','Ceiling footprint','An open loop is a draft.','Draw a partial room-free footprint. The trailing edge stays dashed, and no ceiling is installed.','Close the outline to create. Click the first point, use Backspace to remove a point, or Escape to cancel.','Creation and profile/closure choices are accepted together as one validated transaction.'],
['stretch','S9','Do not imply a room-stretch solver','Plan','Select the boundary you intend to change.','A creator attempts to select two rooms and drag a wing. REGISTER introduces no multi-room stretch handles.','Room stretching is not available. Edit boundary walls in Plan. Existing room-unit movement is a different operation.','No junction duplication, shared-wall splitting or topology repair is hidden inside a vertical tool.']
];
let state={outlineClosed:false,board:'section',target:'O-DOOR',windowHead:2.3,windowWidth:1.8,focusCut:1.75,ceilingCreated:false,head:2.10,sill:0,width:1,windowSill:1.10,depth:4.5,reveal:false,cutOnly:false,face:'North',joint:false,curve:false,history:[],message:'O-DOOR selected · floor datum Y +0.15',native:false,draftCreated:false,cancelled:false,spanFrom:-6,spanTo:5};
// One canonical S1 fixture, read by Plan, Section and 3D so the three views cannot disagree.
// e = metres east of North's west wall · z = metres south of North's north wall.
const FIX={floor:0.15,east:8,north:6,south:5,cutX:4,wallN:4.2,wallSide:3.2,wallShared:3.2,wallS:2.8,ceilN:4.35,ceilS:3.35,door:{width:1,head:2.1,sill:0,at:4},win:{width:1.8,sill:1.1,head:2.3,rise:0.9,at:1.2},eastGallery:{e:9,size:6},curve:{p0:[6.15,2.4],c1:[8.0,3.2],c2:[8.0,4.4],p3:[6.2,5.2],height:2.4},curveBent:{p0:[6.15,2.4],c1:[6.9,4.4],c2:[8.2,4.6],p3:[6.2,5.2],height:2.4},prop:{e:4.9,z:3.3,w:0.42,d:0.42,top:0.78}};
const curveOf=()=>state.curve?FIX.curveBent:FIX.curve;
// 3D editor cutaway projection: e east, z south, h metres above the floor datum.
const AX={ox:150,oy:380,ax:32,ay:-16,bx:16,by:24,U:24};
const axp=(e,z,h)=>[AX.ox+e*AX.ax+z*AX.bx,AX.oy+e*AX.ay+z*AX.by-h*AX.U];
const axl=(p,q,cls)=>line(p[0].toFixed(1),p[1].toFixed(1),q[0].toFixed(1),q[1].toFixed(1),cls);
const axf=(pts,cls)=>path('M'+pts.map(p=>axp(p[0],p[1],p[2]).map(v=>v.toFixed(1)).join(' ')).join('L')+'Z',cls);
const axv=(e,z,h0,h1,cls)=>axl(axp(e,z,h0),axp(e,z,h1),cls);
const ghostWalls=()=>axl(axp(0,0,0),axp(0,0,3.20),'projected')+axl(axp(0,0,3.20),axp(0,6,3.20),'projected')+axl(axp(0,6,0),axp(0,6,2.80),'projected')+axl(axp(0,6,2.80),axp(0,11,2.80),'projected')+axl(axp(0,11,0),axp(0,11,2.80),'projected')+axl(axp(0,11,2.80),axp(8,11,2.80),'projected')+axl(axp(8,11,0),axp(8,11,2.80),'projected');

return ctx(ret,instrumentName(),id==='objects'?'Looking north':mapKind()==='sectionB'?'Normal to C-GABLE ridge · looking east':'Looking east',meta('REGISTERED TO PLAN'))+`<div class="ranges"><label>Depth <input aria-label="Instrument range" id="depth" type="number" step="any" value="${state.depth.toFixed(2)}"> m</label>${button(state.cutOnly?'✓ Cut only':'Cut only','cutOnly')}${button(id==='crop'&&!state.reveal?'Crop Y ≥ 1.00':'Crop…','crop')}${button('Edit cut in Plan','editcut')}<span class="spacer"></span>${state.reveal?button('Restore view','restore'):['excluded','crop','dense-reveal'].includes(id)?button('Reveal','reveal'):fit}</div>`;}
function render(){let b=board(),plan=isPlan(),three=['three','ceiling-three'].includes(state.board);$('#board').value=state.board;$('#caption').textContent=`REGISTER / ${b[1]} / ${b[2]}`;
$('#frame').innerHTML=`<aside class="spine"><div class="station active">${icon('scene')}Scene</div><div class="station">${icon('camera')}Camera</div></aside><header class="head"><span>‹ Projects</span><strong>${state.board==='empty'?'Untitled project':['dense','dense-plan'].includes(state.board)?'Twelve-room wing':'Two galleries'}</strong><span>Local session</span><span class="grow"></span>${button('↶ Undo','undo')}${button('↷ Redo','redo')}<span>Design specimen</span><span class="head-action">Spatial</span><span class="head-action">Publish</span><span class="head-action">Preview</span><span class="head-action">PLATE Light</span><span>Account</span></header><aside class="navigator">${nav()}</aside><section class="work"><div class="viewbar"><button class="viewtab ${!three?'active':''}" data-action="return">Plan</button><button class="viewtab ${three?'active':''}" data-action="three">3D</button><span class="mode">MODE</span><span class="modebtn">Layout</span><span class="muted">Arrange</span><span class="spacer"></span><span class="eyebrow">Snap .10</span><span class="eyebrow">Grid</span><span class="eyebrow">Panels</span></div>${three?'':hostRows()}<div class="paper-row"><aside class="tray"><small>EDIT</small><button class="${armedTool()==='select'?'armed':''}" aria-pressed="${armedTool()==='select'}" data-action="return" aria-label="Select tool">${icon('select')}Select</button><small>INSPECT</small><button class="${armedTool()==='section'?'armed':''}" aria-pressed="${armedTool()==='section'}" data-action="entry" aria-label="Section tool">${icon('section')}Section</button><button data-action="elevation" aria-label="Elevation tool">${icon('wall')}Elevation</button><button class="${armedTool()==='ceiling'?'armed':''}" aria-pressed="${armedTool()==='ceiling'}" data-action="ceilingTool" aria-label="Ceiling tool: create regions or focus overhead">${icon('ceiling')}Ceiling</button><small>MEASURE</small><div class="tool">${icon('measure')}Measure</div></aside><div class="canvas">${svg(draw(),'0 0 772 738',`${b[1]} ${b[2]}`)}${message()}</div></div></section><aside class="inspector">${inspector()}</aside><footer class="status"><span>Scene · ${three?'3D':plan?'Plan · Layout':`Plan › ${instrumentName()}`}</span><span class="mono">${displayRef()}</span><span id="status-message" role="status">${esc(state.message)}</span><span class="push mono">Y datum +0.15 · ${state.history.length} demo edits</span></footer>`;
$('#notes').innerHTML=`<h2>${b[1]} · ${b[4]}</h2><div class="columns"><div><div class="tag">Entry</div><p>${b[5]}</p></div><div><div class="tag">Active editing / failure</div><p>${b[6]}</p></div><div><div class="tag">Commit / return</div><p>${b[7]}</p></div></div><div class="practice"><b>Try the prototype:</b> edit head or sill in the Inspector and commit, click a solid blue grip to focus its exact field (a dashed grip is an illustrated drag), use Undo, then Return to Plan. On S4 Reveal one column-4 opening. S5 Joint chooses the trim; S6 uses Reveal and Restore view independently of Undo. S9 Cancel discards a draft and the drawing drops it. These are bounded design simulations; boards without a live demonstration are annotated states, not a geometry implementation. <a href="direction.md">Full rules and owner decisions →</a></div>`;
const form=$('#values');if(form){form.addEventListener('submit',e=>{e.preventDefault();let data=new FormData(form),h=Number(data.get('head')),s=Number(data.get('sill')),w=Number(data.get('width'));if(!Number.isFinite(h+s+w)||h<=s||s<0||h>3.2||w<=0||w>(isWindow()?6:8)){state.message='Refused · head must fit host; sill ≥ 0; width > 0';$('#status-message').textContent=state.message;form.querySelector('[name=head]').setAttribute('aria-invalid','true');return;}const before={head:state.head,sill:state.sill,width:state.width,windowSill:state.windowSill,windowHead:state.windowHead,windowWidth:state.windowWidth};if(isWindow()){if(s===state.windowSill&&h===state.windowHead&&w===state.windowWidth){state.message='No change · no history entry';render();return;}Object.assign(state,{windowSill:s,windowHead:h,windowWidth:w});}else{if(h===state.head&&s===state.sill&&w===state.width){state.message='No change · no history entry';render();return;}Object.assign(state,{head:h,sill:s,width:w});}state.history.push(before);state.redo=null;state.message='Committed opening edit · one Layout transaction';render();});form.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();state.message='Draft cancelled · document unchanged';render();}});}
$('#depth')?.addEventListener('change',e=>{let d=Number(e.target.value);if(d<=0||!Number.isFinite(d)){state.message='Range must be finite and positive';render();return;}if(state.board==='focus'){state.focusCut=d;state.message=`Cut height Y ${d.toFixed(2)} · instrument only`;render();return;}state.depth=d;state.reveal=false;state.message=`Range changed · zero Layout history${instrumentKind()==='section'&&d<4?' · O-WINDOW now outside depth':''}`;render();});
$('#search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.navrow').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none');});resize();}
// Every board opens in its own canonical state: a demonstration toggle never survives navigation.
function go(id){state.board=id;state.cancelled=false;state.reveal=false;state.outlineClosed=id==='spanning';state.curve=false;state.joint=false;state.cutOnly=false;state.face='North';state.draftCreated=false;state.ceilingCreated=false;state.target=targetFor(id);state.message=`${board()[1]} · ${displayRef()==='—'?'nothing selected':`${displayRef()} selected`} · datum Y +0.15`;state.depth=id==='excluded'?2:['dense','dense-plan','dense-reveal'].includes(id)?6:id==='empty'?5:4.5;render();}
function act(a){if(a==='ceilingTool'){if(isCeiling()){state.board='focus';state.message=`${state.target} retained · reflected instrument`;render();return;}state.board='spanning';state.draftCreated=false;state.target='DRAFT';state.message='Ceiling tool armed · Use room outline or Draw region · the footprint is a draft';render();return;}if(a==='focus'){if(isCeiling()){state.board='focus';state.message=`${state.target} retained · reflected instrument`;render();return;}go('focus');return;}if(a==='elevation'&&state.target==='W-N2M2'){state.message='W-N2M2 elevation is not drawn in this atlas · see the S3 elevation boards';render();return;}
if(a==='elevation'&&isWindow()){state.board='arch';state.message='O-WINDOW retained · its host W-EAST elevation';render();return;}if(a==='elevation'&&state.target.startsWith('W-')){state.board=state.target==='W-CURVE'?'curve':'gable';state.message=`${state.target} retained · wall elevation`;render();return;}if(a==='return'||a==='three'){state.board=(a==='three'&&isCeiling())?'ceiling-three':a;state.reveal=false;state.message=`${state.target} retained · view changed, architecture unchanged`;render();return;}if(a==='crop'&&instrumentKind()!=='section'){state.message='Vertical crop brackets · absolute-Y fields in this host (S6 shows the section case)';render();return;}if(boards.some(b=>b[0]===a)){go(a);return;}if(['head','sill','width'].includes(a)){let el=document.querySelector(`[name=${a}]`);if(el){el.focus();el.select();}return;}switch(a){case'reveal':state.reveal=true;state.message='One source revealed · no Layout history';break;case'restore':state.reveal=false;state.message='Previous view restored · architecture unchanged';break;case'undo':{if(state.board==='deleted'){go('gable');state.message='Deletion undone · W-SHARED identity, altitude and selection restored';break;}let prev=state.history.pop();if(prev){state.redo={head:state.head,sill:state.sill,width:state.width,windowSill:state.windowSill,windowHead:state.windowHead,windowWidth:state.windowWidth};Object.assign(state,prev);state.message='Opening edit undone · view unchanged';}else state.message='No demonstration edit to undo';break;}case'redo':if(state.redo){state.history.push({head:state.head,sill:state.sill,width:state.width,windowSill:state.windowSill,windowHead:state.windowHead,windowWidth:state.windowWidth});Object.assign(state,state.redo);state.redo=null;state.message='Opening edit restored · view unchanged';}else state.message='Nothing to redo';break;case'face':state.face=state.face==='North'?'South':'North';state.message='Opposite face · same W-SHARED and O-DOOR';break;case'cutOnly':state.cutOnly=!state.cutOnly;state.message='Projection policy changed · no Layout history';break;case'fit':state.message='Included geometry fitted · ranges unchanged';break;case'createCeiling':state.ceilingCreated=true;state.draftCreated=true;state.target='C-SPAN';state.message='C-SPAN created · one Layout transaction · the draft became a region';break;case'trimJoint':state.joint=true;state.message='Explicit trim accepted · both canonical sources retained';break;case'undoJoint':state.joint=false;state.message='Joint returned to proposal state';break;case'bend':state.curve=!state.curve;state.message='Tangent follows the changed canonical curve';break;case'footprint':state.board=state.target==='C-SPAN'?'spanning':'multiple';state.message=`${state.target} retained · footprint in Plan`;break;case'ceilingSection':state.board='ceiling-section';state.message=`${state.target} retained · profile section`;break;case'closeOutline':state.outlineClosed=true;state.message='Outline closed · still a draft, no Layout history';break;case'createDraft':state.message='Create would validate and commit one Layout transaction · illustrated only';break;case'cancelSection':state.cancelled=true;state.message='Section cancelled · the tool is no longer armed and nothing was created';break;case'cancelCeiling':state.cancelled=true;state.target='';state.message='Ceiling tool cancelled · the draft left the drawing, no Layout history';break;case'discard':state.cancelled=true;state.message='Section A discarded · no retained range, no Layout history';break;case'resetCut':state.focusCut=1.75;state.message='Cut reset to floor +1.60 (Y 1.75) · instrument only';break;case'spanEnd':state.message='Range endpoint · dragging changes the span and writes no Layout history';break;
case'depthEdge':state.message='Depth edge · dragging changes depth and writes no Layout history';break;
case'lookFlip':state.message='Look direction · the arrow flips the view about the same line; Plan keeps the same cut';break;case'profileEave':state.message='Eave height · the wall elevation owns this grip and the Inspector shows the same value';break;case'profileRidge':state.message='Ridge height and station · the wall elevation owns this grip and the Inspector shows the same value';break;case'curveStation':state.message='Vertical station grip · exact at this station; widths stay arc length in the Inspector';break;case'clearMarquee':state.message='Marquee cleared · the selection is unchanged';break;case'rise':state.message='Rise 0.45 m specimen · a new authored profile capability, not shipped behavior';break;case'ceilingLift':state.message='Whole-underside lift preserves profile · use profile section for eaves';break;case'platform':state.message='Top lift preserves 0.20 m thickness';break;}render();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t)act(t.dataset.action);});document.addEventListener('keydown',e=>{const t=e.target.closest('[data-action]');if(t&&t.tagName.toLowerCase()==='g'&&['Enter',' '].includes(e.key)){e.preventDefault();act(t.dataset.action);}});
$('#board').innerHTML=boards.map(b=>`<option value="${b[0]}">${b[1]} · ${b[2]}</option>`).join('');$('#board').addEventListener('change',e=>go(e.target.value));$('#prev').onclick=()=>go(boards[(boards.findIndex(b=>b[0]===state.board)+boards.length-1)%boards.length][0]);$('#next').onclick=()=>go(boards[(boards.findIndex(b=>b[0]===state.board)+1)%boards.length][0]);$('#reset').onclick=()=>{Object.assign(state,{head:2.1,sill:0,width:1,windowSill:1.1,windowHead:2.3,windowWidth:1.8,target:'O-DOOR',focusCut:1.75,history:[],redo:null,reveal:false,joint:false,curve:false,cutOnly:false,face:'North',ceilingCreated:false,draftCreated:false,cancelled:false,outlineClosed:false});go('section');};$('#scale').onclick=()=>{state.native=!state.native;$('#scale').setAttribute('aria-pressed',state.native);$('#scale').textContent=state.native?'Fit frame to window':'View at 1:1';resize();};function resize(){let width=Math.max(320,window.innerWidth-40),scale=state.native?1:Math.min(1,width/1440);$('.stage-slot').style.width=`${1440*scale}px`;$('.stage-slot').style.height=`${900*scale}px`;$('#frame').style.transform=`scale(${scale})`;}window.addEventListener('resize',resize);const requested=new URLSearchParams(location.search).get('board');if(requested&&boards.some(b=>b[0]===requested))go(requested);else render();
</script></body></html>
