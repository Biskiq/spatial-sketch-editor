<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biskiq production shell — wireframe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wfbar" role="navigation" aria-label="Wireframe controls (not product UI)">
    <b>WIREFRAME</b><span>production shell · exploration, not a contract</span>
    <span class="sp"></span>
    <button data-wfbar="journeys">Journeys ▾</button>
    <button data-wfbar="compare">Compare ▾</button>
    <button data-wfbar="width">Width ▾</button>
    <button data-wfbar="about">About ▾</button>
    <div id="wfmenu" class="wfmenu" style="display:none"></div>
  </div>
  <div class="viewport">
    <div class="frame" id="frame">
      <div class="app" id="app">
        <header class="head" id="head"></header>
        <div class="body">
          <aside class="index" id="index" aria-label="Index"></aside>
          <main class="stage" id="stage" aria-label="Stage">
            <svg class="world" id="world" preserveAspectRatio="xMidYMid meet"></svg>
            <svg class="ovl" id="ovl"></svg>
            <div id="furn"></div>
            <div id="rail"></div>
            <div id="card"></div>
            <div id="side"></div>
            <div id="lower"></div>
            <div id="float"></div>
          </main>
          <div id="isheet"></div>
        </div>
      </div>
      <div id="previewhost"></div>
    </div>
  </div>
  <div id="coach"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
