<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biskiq production shell — wireframe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wfbar" role="navigation" aria-label="Wireframe controls (not product UI)">
    <b>WIREFRAME</b><span>production shell · round 2 · exploration, not a contract</span>
    <span class="sp"></span>
    <button data-wfbar="tours">Tours ▾</button>
    <button data-wfbar="compare" id="wfbar-compare">Compare ▾</button>
    <button data-wfbar="scenario">Project ▾</button>
    <button data-wfbar="width">Width ▾</button>
    <a class="wfa" href="atlas.html" target="_blank" rel="noopener">Atlas ↗</a>
    <button data-wfbar="about">About ▾</button>
    <div id="wfmenu" class="wfmenu" style="display:none"></div>
  </div>
  <div class="viewport">
    <div class="frame" id="frame">
      <div class="app" id="app">
        <header class="head" id="head"></header>
        <div id="findlist"></div>
        <div class="body">
          <aside class="index" id="index" aria-label="Index"></aside>
          <main class="stage" id="stage" aria-label="Stage">
            <svg class="world" id="world" preserveAspectRatio="xMidYMid meet"></svg>
            <svg class="ovl" id="ovl"></svg>
            <div id="furn"></div>
            <div id="rail"></div>
            <div id="card"></div>
                        <div id="lower"></div>
            <div id="float"></div>
          </main>
          <div id="isheet"></div>
        </div>
      </div>
      <div id="previewhost"></div>
    </div>
  </div>
  <div id="tourlayer"></div>
  <script type="module" src="app.js"></script>
<script>/* ES modules do not load from file://: say so instead of showing a blank page */
if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', () => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:auto 16px 16px 16px;z-index:999;padding:14px 16px;border-radius:10px;background:#f3f0e4;color:#14261f;font:14px/1.45 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)'; d.innerHTML = '<b>This page needs its local server.</b> Browsers block the wireframe\'s modules on <code>file://</code>, so every frame stays blank. Run <code>python3 serve.py 8850</code> in <code>prototypes/production-shell-wireframe</code> and open <code>http://127.0.0.1:8850/atlas.html</code>.'; document.body.appendChild(d); });
</script>
</body>
</html>
