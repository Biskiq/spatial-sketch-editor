<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum Editor — Experience (alternative)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/visitor.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M4 21V10a8 8 0 0 1 16 0v11" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8.5 21v-8a3.5 3.5 0 0 1 7 0v8" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="6.2" r="1.9" fill="var(--gold-400)"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 20 20"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></symbol>
    <symbol id="i-exit" viewBox="0 0 20 20"><path d="M8 4H4.5v12H8M12 6.5 15.5 10 12 13.5M15.5 10H8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 20 20"><rect x="5.5" y="4.5" width="3" height="11" rx=".8" fill="currentColor"/><rect x="11.5" y="4.5" width="3" height="11" rx=".8" fill="currentColor"/></symbol>
    <symbol id="i-follow" viewBox="0 0 20 20"><rect x="2.5" y="6" width="10" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m12.5 9 5-2.5v7l-5-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 20 20"><path d="M7 5 3.5 8.5 7 12M4 8.5h7.5a4.5 4.5 0 0 1 0 9H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-redo" viewBox="0 0 20 20"><path d="M13 5l3.5 3.5L13 12M16 8.5H8.5a4.5 4.5 0 0 0 0 9H11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 20 20"><path d="M12 4.5 6.5 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 20 20"><path d="M8 4.5l5.5 5.5L8 15.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M3.5 10h12M11 5.5l4.5 4.5-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-open" viewBox="0 0 20 20"><path d="M8 4.5H4.5v11h11V12M11 4.5h4.5V9M15.5 4.5 9 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 20 20"><circle cx="4.5" cy="10" r="1.5" fill="currentColor"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><circle cx="15.5" cy="10" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-grip" viewBox="0 0 20 20"><g fill="currentColor"><circle cx="7.5" cy="5.5" r="1.3"/><circle cx="12.5" cy="5.5" r="1.3"/><circle cx="7.5" cy="10" r="1.3"/><circle cx="12.5" cy="10" r="1.3"/><circle cx="7.5" cy="14.5" r="1.3"/><circle cx="12.5" cy="14.5" r="1.3"/></g></symbol>
    <symbol id="i-diamond" viewBox="0 0 20 20"><path d="M10 3.5 16.5 10 10 16.5 3.5 10Z" fill="currentColor"/></symbol>
    <symbol id="i-camera" viewBox="0 0 20 20"><path d="M3 6.5h3l1.5-2h5L14 6.5h3v9H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="11" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-place" viewBox="0 0 20 20"><circle cx="6" cy="14" r="2.4" fill="currentColor"/><path d="M7.5 12.5 16 4M16 4v5M16 4h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-frame" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12.5l4-3.5 3.5 3 2.5-2 4 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-guide" viewBox="0 0 20 20"><circle cx="4" cy="14.5" r="2" fill="currentColor"/><circle cx="16" cy="5.5" r="2" fill="currentColor"/><path d="M5.5 13.5c3-1 2-5 5-5.5s3.5-1.5 4.5-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/></symbol>
    <symbol id="i-plan" viewBox="0 0 20 20"><path d="M3 4h14v12H3zM3 10h6M11 4v5M11 13v3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-cube" viewBox="0 0 20 20"><path d="M10 2.8 16.5 6.4v7.2L10 17.2 3.5 13.6V6.4ZM3.5 6.4 10 10l6.5-3.6M10 10v7.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-cut" viewBox="0 0 20 20"><circle cx="5.5" cy="14.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14.5" cy="14.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.2 12.8 14 3.5M12.8 12.8 6 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-travel" viewBox="0 0 20 20"><path d="M3 14c3.5 0 4-8 8-8h4.5M13 3.5 15.5 6 13 8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 20 20"><path d="M5 10h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-fit" viewBox="0 0 20 20"><path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-panel" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4v12" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-warn" viewBox="0 0 20 20"><path d="M10 3 18 16.5H2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4M10 14.2v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-compass" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m12.8 7.2-1.6 4-4 1.6 1.6-4z" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M5.5 6l.8 10h7.4l.8-10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="frame" id="frame">
<div class="app" id="app">
  <header class="head" id="head"></header>
  <div class="body">
    <nav class="index" id="index" aria-label="Experience outline"></nav>
    <section class="stage" id="stage" aria-label="Stage">
      <div class="stage-plan" id="plan-host"></div>
      <div class="stage-3d" id="three-host"></div>
      <div class="stage-labels" id="stage-labels" aria-hidden="true"></div>
      <div class="stage-chrome" id="stage-chrome"></div>
    </section>
    <aside class="card" id="card" aria-live="polite"></aside>
  </div>
  <section class="deck" id="deck" aria-label="Guide"></section>
  <div class="toast" id="toast" role="status"></div>
</div>
</div>
<div class="visitor" id="visitor" hidden></div>
<div class="menu-layer" id="menu-layer"></div>

<script type="module" src="app/main.js"></script>
</body>
</html>
