# Confirm the service name, region, and plan before the first Render sync or
# any paid resource is created.
services:
  - type: web
    name: biskiq-api
    runtime: node
    region: ohio
    plan: starter
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start -w @biskiq/api
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_KEY
        sync: false
      # Comma-separated edge proxy addresses/CIDRs. Set this to Render's edge
      # proxy range; unset means X-Forwarded-For is ignored and every client
      # shares one throttle source.
      - key: TRUST_PROXY
        sync: false
      - key: EDITOR_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      # Unique per environment; scopes asset keys and the epoch purge.
      - key: R2_OBJECT_NAMESPACE
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
